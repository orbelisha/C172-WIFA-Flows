<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="C-172 Flows">
    <meta name="mobile-web-app-capable" content="yes">
    <title>C-172 Flows Master</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --primary-color: #2563eb;
            --hover-color: #e5e7eb;
            --correct-color: #10b981;
            --wrong-color: #ef4444;
            --flow-bg: #f8fafc;
            --border-color: #d1d5db;
            --highlight-blue: #3b82f6; 
            --highlight-text: #1e3a8a;
            --highlight-bg: #eff6ff;
            --highlight-hover: #dbeafe;
        }

        /* Dark Mode Variables */
        body.dark-mode {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --primary-color: #60a5fa;
            --hover-color: #374151;
            --correct-color: #34d399;
            --wrong-color: #f87171;
            --flow-bg: #111827;
            --border-color: #374151;
            --highlight-blue: #60a5fa;
            --highlight-text: #eff6ff;
            --highlight-bg: #1e3a8a;
            --highlight-hover: #2563eb;
        }

        * {
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-top: env(safe-area-inset-top, 60px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Top Navigation Buttons */
        .top-nav {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .action-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 0.9em;
        }

        .action-btn:hover {
            background-color: var(--primary-color);
            color: var(--card-bg);
        }

        #backBtn { display: none; }

        h1 { color: var(--primary-color); margin-top: 50px; margin-bottom: 5px; text-align: center; font-size: 1.8em; }
        .subtitle { color: #6b7280; margin-bottom: 25px; text-align: center; font-weight: bold; font-size: 0.9em; padding: 0 10px; }
        body.dark-mode .subtitle { color: #9ca3af; }
        
        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            position: relative;
            transition: background-color 0.3s, border-color 0.3s;
        }
        
        /* Menu Styles */
        #homeScreen { display: block; }
        
        .category-section {
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
        }
        .category-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .category-title {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.25em;
            text-align: left;
            padding-left: 12px;
            border-left: 4px solid var(--primary-color);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .menu-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            padding: 15px 10px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 80px;
            justify-content: center;
        }
        
        .menu-btn.highlight-blue {
            border-color: var(--highlight-blue);
            border-width: 2px;
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
        }
        .menu-btn.highlight-blue:hover {
            background-color: var(--highlight-hover);
            transform: translateY(-2px);
        }
        .menu-btn.highlight-blue small { color: var(--highlight-blue); font-weight: bold; }

        .menu-btn:not(.highlight-blue):hover {
            background-color: var(--hover-color);
            border-color: var(--border-color);
            transform: translateY(-2px);
        }

        .menu-btn small { font-size: 0.8em; color: #6b7280; margin-top: 6px; font-weight: normal; }
        body.dark-mode .menu-btn small { color: #9ca3af; }

        /* Quiz Styles */
        #quizScreen { display: none; }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #6b7280;
            font-size: 1em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        body.dark-mode .question-header { color: #9ca3af; }

        .question-text {
            font-size: 1.25em;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.4;
            color: var(--text-color);
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            padding: 16px 14px;
            font-size: 1.05em;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            line-height: 1.5;
            white-space: normal; 
            word-break: break-word;
            min-height: 50px;
            display: flex;
            align-items: center;
        }
        .option-btn:hover:not(:disabled) {
            background-color: var(--hover-color);
        }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { 
            background-color: rgba(16, 185, 129, 0.1); 
            border-color: var(--correct-color); 
            color: var(--correct-color); 
            font-weight: bold; 
        }
        .option-btn.wrong { 
            background-color: rgba(239, 68, 68, 0.1); 
            border-color: var(--wrong-color); 
            color: var(--wrong-color); 
            font-weight: bold; 
        }

        .feedback {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.05em;
            display: none;
            line-height: 1.6;
        }
        .feedback.show { display: block; }
        .feedback.success { background-color: rgba(16, 185, 129, 0.1); color: var(--correct-color); border: 1px solid var(--correct-color); }
        .feedback.error { background-color: rgba(239, 68, 68, 0.1); color: var(--wrong-color); border: 1px solid var(--wrong-color); }

        .flow-box {
            background-color: var(--flow-bg);
            border-left: 4px solid var(--primary-color);
            padding: 15px 20px;
            margin-top: 15px;
            border-radius: 6px;
            text-align: left;
            border: 1px solid var(--border-color);
        }
        .flow-box h4 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            text-align: left;
            font-size: 1.1em;
        }
        .flow-box ol { margin: 0; padding-left: 20px; color: var(--text-color); font-weight: 500; }
        .flow-box li { margin-bottom: 6px; font-size: 0.95em; line-height: 1.4; }

        .next-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 18px 25px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 25px;
            width: 100%;
            display: none;
        }
        body.dark-mode .next-btn { color: #111827; }
        .next-btn:active { transform: scale(0.98); }
        .next-btn:hover { opacity: 0.9; }

        /* Score Styles */
        #scoreScreen { display: none; text-align: center; }
        .score-val { font-size: 3.5em; font-weight: bold; color: var(--primary-color); margin: 15px 0; }
        .home-btn { background-color: var(--hover-color); color: var(--text-color); margin-top: 15px; border: 1px solid var(--border-color); }

        /* ================== SIDE PANEL STYLES ================== */
        #panelOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 998;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }
        #panelOverlay.open { display: block; opacity: 1; }

        #flowSidePanel {
            position: fixed;
            top: 0; right: -340px; 
            width: 320px; max-width: 85vw; height: 100vh;
            background-color: var(--card-bg);
            box-shadow: -4px 0 25px rgba(0,0,0,0.2);
            transition: right 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 1000; overflow-y: auto;
            border-left: 4px solid var(--primary-color);
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        #flowSidePanel.open { right: 0; }

        .panel-content { padding: 25px 20px; padding-bottom: 80px; }
        .panel-content h3 {
            color: var(--primary-color); margin-top: env(safe-area-inset-top, 20px); margin-bottom: 15px;
            font-size: 1.2em; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;
        }
        .panel-content ol { padding-left: 20px; color: var(--text-color); font-size: 1em; line-height: 1.5; margin: 0; }
        .panel-content li { margin-bottom: 12px; }

        #panelToggleBtn {
            position: fixed; top: 50%; right: 0; transform: translateY(-50%);
            background-color: var(--primary-color); color: #ffffff; border: none;
            padding: 20px 10px; border-radius: 8px 0 0 8px; cursor: pointer;
            z-index: 1001; transition: right 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            font-size: 0.9em; font-weight: bold; display: none; outline: none;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 2px;
        }
        body.dark-mode #panelToggleBtn { color: #111827; }
        #panelToggleBtn.open { right: 320px; }

        @media (max-width: 600px) {
            .container { padding: 20px 15px; border-radius: 10px; }
            .menu-grid { grid-template-columns: 1fr; } 
            .menu-btn { padding: 20px 15px; font-size: 1.15em; }
            #panelToggleBtn.open { right: 85vw; }
            #flowSidePanel { width: 85vw; }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="action-btn" id="backBtn" onclick="goHome()">Back</button>
        <button class="action-btn" id="themeToggleBtn" onclick="toggleTheme()" style="margin-left: auto;">Dark Mode</button>
    </div>

    <!-- Overlay for side panel -->
    <div id="panelOverlay" onclick="closeSidePanel()"></div>

    <!-- Side Panel Drawer -->
    <button id="panelToggleBtn" onclick="toggleSidePanel()">View Flow</button>
    <div id="flowSidePanel">
        <div class="panel-content">
            <h3 id="sidePanelTitle">Flow Title</h3>
            <div id="sidePanelList"></div>
        </div>
    </div>

    <h1>C-172 Flows Training</h1>
    <div class="subtitle">Blue Highlight = Mandatory Memory Items</div>

    <!-- MAIN MENU -->
    <div class="container" id="homeScreen">
        <h2 style="text-align: center; color: var(--text-color); margin-top: 0; margin-bottom: 25px; font-size: 1.4em;">Training Menu by Flight Stages</h2>
        <div id="menuContainer">
            <!-- Dynamically generated menu -->
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="container" id="quizScreen">
        <div class="question-header">
            <span id="qNumber">Question 1 of 15</span>
            <span id="qScore" style="color: var(--primary-color);">Correct: 0 | Err: 0</span>
        </div>
        <div class="question-text" id="qText">Loading question...</div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedbackBox"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Continue</button>
    </div>

    <!-- SCORE SCREEN -->
    <div class="container" id="scoreScreen">
        <h2 style="margin-top: 0;">Drill Completed</h2>
        <div class="score-val" id="finalScore">0%</div>
        <div id="finalStats" style="color: #6b7280; margin-bottom: 25px; font-size: 1.1em;"></div>
        <button class="next-btn" style="display: block;" onclick="restartSameQuiz()">Retry Same Drill</button>
    </div>

    <script>
        const QUESTIONS_PER_DRILL = 15;

        // Database with Flows, Weather, and Acronyms
        const allFlowsData = {
            "ColdStart": { title: "Cold Start", text: "Cold Engine Start Flow", items: ["Primer 2-5 STROKES & LOCK", "Master Switch ON", "Lights AS REQUIRED", "Throttle OPEN 1/8 INCH", "Prop Area CLEAR", "Starter ENGAGE", "Throttle 1,000 RPM", "Oil Pressure GREEN", "Mixture LEAN FOR TAXI"] },
            "FloodedStart": { title: "Flooded Start", text: "Flooded Engine Start Flow", items: ["Primer DO NOT PRIME", "Mixture IDLE CUTOFF", "Throttle FULL OPEN", "Starter ENGAGE", "Mixture FULL RICH (When Starts)", "Throttle 1,000 RPM (When Starts)"] },
            "FireStart": { title: "Fire (Start)", text: "Engine Fire During Start", items: ["Cranking CONTINUE", "If Fails: Throttle FULL OPEN", "Mixture IDLE CUTOFF", "Cranking CONTINUE for 3 MINS", "Fire Extinguisher OBTAIN", "Master/Ignition/Fuel OFF"] },
            "SixPlusSix": { title: "6+6 Flow", text: "Before Taxi Check", items: ["Transponder Code / Clearance", "Barometers", "Altitude Pre-Select(s)", "Comms", "NAVS", "GPS (and MFD ranges)"] },
            "Runup": { title: "Runup", text: "Engine Runup Flow", items: ["Parking Brake SET", "Throttle 1,700 RPM", "Magnetos CHECK (Max Drop 125, Diff 50)", "Engine Instruments CHECK", "Alternator CHECK", "Carburetor Heat ON, CHECK", "Throttle IDLE", "Carburetor Heat OFF", "Throttle 1,000 RPM"] },
            "HalfAndHalfNonEngine": { title: "1/2 & 1/2 (Non-Engine)", text: "Before Takeoff (Non-Engine Items)", items: ["Controls (FREE & CORRECT)", "Circuit Breakers (Elec Trim & AP Test)", "Trims Reset for Takeoff", "Lights", "GPS #2"] },
            "HalfAndHalfEngine": { title: "1/2 & 1/2 (Engine)", text: "Before Takeoff (Engine Items)", items: ["Gauges", "Magnetos", "Carb Heat", "Idle Check"] },
            "Climb": { title: "Climb Flow", text: "Climb Flow (500' AGL)", items: ["Flaps UP ('Flaps Up Climb Check')", "Verify Flaps UP", "(Verify Gear UP)", "Taxi Light OFF", "Engine Instruments CHECK"] },
            "DIMS": { title: "DIMS", text: "Cruise Checklist (DIMS)", items: ["D - Directional Gyro ADJUST", "I - Instruments (Engine) CHECK", "M - Mixture LEAN", "S - Switches (Landing Light) AS REQUIRED", "Next Frequencies PREPARE", "Map Range AS APPROPRIATE", "TOD DETERMINE"] },
            "FourCs": { title: "4 C's", text: "Pre-Maneuver", items: ["Clearing Turns - PERFORM", "Non Congested Area - VERIFY", "Checklist - PERFORM", "declare - PERFORM"] },
            "ABC": { title: "ABC", text: "Descent Checklist (ABC)", items: ["A - ATIS/AWOS OBTAIN", "B - Brief (Approach/Arrival) PERFORM", "C - Checklist PERFORM"] },
            "Abeam": { title: "Abeam Numbers", text: "Traffic Pattern: Abeam Numbers", items: ["'Gear Down, Go Down'", "Power 1500 RPMs", "Check Airspeed (Below Vfe)", "Flaps 1 (10 deg)", "Pitch down 3 deg below horizon", "Landing Light ON"] },
            "Base": { title: "Base Leg", text: "Traffic Pattern: Base Leg", items: ["Turn Base at 45 deg from numbers", "Wings Level on Base", "Check Airspeed Vref +10", "Flaps 2 (20 deg)"] },
            "CGUMPS": { title: "CGUMPS", text: "Final Check", items: ["C-learance & Carb Heat OBTAIN", "G-as on fullest tank (BOTH)", "U-ndercarriage DOWN and WELDED", "M-ixture full rich (<3000' D.A)", "P-umps (Aux pump ON / Primer locked)", "S-eatbelts secure & Switches CHECK"] },
            "GoAround": { title: "Go Around", text: "Go Around Cleanup Flow", items: ["Full Power + Pitch up to Vy attitude", "Flaps UP INCREMENTALLY", "(Gear UP)", "Flaps UP", "Flaps UP", "(Cowl Flaps OPEN)"] },
            "EngineFailAir": { title: "ABCD (Engine Fail)", text: "Engine Failure in Flight", items: ["A-irspeed (68 KIAS)", "B-est Place to Land (Find & Turn)", "C-hecklist (Restart or Securing)", "D-eclare (SQK 7700 & 121.5)"] },
            "FireAir": { title: "Fire (In Flight)", text: "Engine Fire in Flight", items: ["Mixture IDLE CUTOFF", "Fuel Selector OFF", "Master Switch OFF", "Cabin Air & Heat OFF", "Airspeed 100 KIAS or MORE", "Engine Securing APPLY"] },
            
            // New Categories: Weather & Acronyms
            "WeatherCodes": { title: "TAF / METAR", text: "Weather Codes", items: ["RA - Rain", "SN - Snow", "DZ - Drizzle", "BR - Mist", "FG - Fog", "HZ - Haze", "TS - Thunderstorm", "SH - Showers", "FZ - Freezing", "BL - Blowing"] },
            "VFRAcronyms": { title: "VFR Equipment", text: "ATOMATOFLAMES", items: ["A - Altimeter", "T - Tachometer", "O - Oil Pressure", "M - Manifold Pressure", "A - Airspeed", "T - Temperature Gauge", "O - Oil Temp", "F - Fuel Gauge", "L - Landing Gear Pos", "A - Anti-collision Lights", "M - Magnetic Compass", "E - ELT", "S - Seatbelts"] }
        };

        const flightStages = [
            {
                stageTitle: "1. Ground: Prep & Engine Start",
                flows: ["ColdStart", "FloodedStart", "FireStart", "SixPlusSix"]
            },
            {
                stageTitle: "2. Ground: Runup & Before Takeoff",
                flows: ["Runup", "HalfAndHalfNonEngine", "HalfAndHalfEngine"]
            },
            {
                stageTitle: "3. Air: Climb, Cruise & Maneuvers",
                flows: ["Climb", "DIMS", "FourCs"]
            },
            {
                stageTitle: "4. Air: Descent, Pattern & Landing",
                flows: ["ABC", "Abeam", "Base", "CGUMPS", "GoAround"]
            },
            {
                stageTitle: "5. Air: In-Flight Emergencies",
                flows: ["EngineFailAir", "FireAir"]
            },
            {
                stageTitle: "6. Weather & Acronyms",
                flows: ["WeatherCodes", "VFRAcronyms"]
            }
        ];

        const highlightedFlows = ["SixPlusSix", "HalfAndHalfNonEngine", "HalfAndHalfEngine", "DIMS", "FourCs", "ABC", "CGUMPS", "EngineFailAir", "WeatherCodes", "VFRAcronyms"];

        let currentActiveFlow = null;
        let generatedQuestions = [];
        let currentQ = 0;
        let score = 0;
        let errors = 0;
        let isAnswered = false;
        let currentFlowId = "";

        // Theme Toggle Logic
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeToggleBtn').innerText = isDark ? "Light Mode" : "Dark Mode";
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Apply saved theme on load
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeToggleBtn').innerText = "Light Mode";
        }

        // Build the menu
        const menuContainer = document.getElementById('menuContainer');
        flightStages.forEach(stage => {
            let section = document.createElement('div');
            section.className = 'category-section';
            
            let header = document.createElement('h3');
            header.className = 'category-title';
            header.innerText = stage.stageTitle;
            section.appendChild(header);
            
            let grid = document.createElement('div');
            grid.className = 'menu-grid';
            
            stage.flows.forEach(key => {
                let btn = document.createElement('button');
                btn.className = 'menu-btn';
                if (highlightedFlows.includes(key)) btn.classList.add('highlight-blue');
                btn.innerHTML = `${allFlowsData[key].title} <small>${allFlowsData[key].text}</small>`;
                btn.onclick = () => startQuiz(key);
                grid.appendChild(btn);
            });
            
            section.appendChild(grid);
            menuContainer.appendChild(section);
        });

        // Side Panel Logic
        function toggleSidePanel() {
            const panel = document.getElementById('flowSidePanel');
            const btn = document.getElementById('panelToggleBtn');
            const overlay = document.getElementById('panelOverlay');
            
            panel.classList.toggle('open');
            btn.classList.toggle('open');
            overlay.classList.toggle('open');
            
            btn.innerText = panel.classList.contains('open') ? 'Hide Flow' : 'View Flow';
        }

        function updateSidePanelContent(q) {
            document.getElementById('sidePanelTitle').innerText = q.flowTitle;
            document.getElementById('sidePanelList').innerHTML = renderFlowList(q.flowItems);
        }

        function closeSidePanel() {
            document.getElementById('flowSidePanel').classList.remove('open');
            document.getElementById('panelToggleBtn').classList.remove('open');
            document.getElementById('panelOverlay').classList.remove('open');
            document.getElementById('panelToggleBtn').innerText = 'View Flow';
        }

        function renderFlowList(items) {
            return "<ol>" + items.map(item => `<li>${item}</li>`).join('') + "</ol>";
        }

        // Question Generators
        function genWhatIsNext() {
            let flow = currentActiveFlow;
            if (flow.items.length < 2) return null;
            let idx = Math.floor(Math.random() * (flow.items.length - 1));
            let currentItem = flow.items[idx];
            let nextItem = flow.items[idx + 1];
            
            let wrong1 = flow.items[(idx + 2) % flow.items.length];
            let randomOtherFlow = Object.values(allFlowsData).filter(f => f.title !== flow.title)[Math.floor(Math.random() * (Object.keys(allFlowsData).length - 1))];
            let wrong2 = randomOtherFlow.items[Math.floor(Math.random() * randomOtherFlow.items.length)];
            
            if(wrong1 === nextItem) wrong1 = "Master Switch OFF";
            if(wrong2 === nextItem) wrong2 = "Declare Emergency";

            return {
                question: `In ${flow.text}, what comes immediately after "${currentItem}"?`,
                options: [nextItem, wrong1, wrong2],
                correctAnswer: 0,
                explanation: `The action that immediately follows is: <strong>${nextItem}</strong>`,
                flowTitle: flow.text, flowItems: flow.items
            };
        }

        function genFirstAction() {
            let flow = currentActiveFlow;
            let firstItem = flow.items[0];
            let wrong1 = flow.items[1] || "Throttle IDLE";
            let wrong2 = flow.items[flow.items.length - 1] || "Mixture CUTOFF";
            
            return {
                question: `What is the **first** item in ${flow.text}?`,
                options: [firstItem, wrong1, wrong2],
                correctAnswer: 0,
                explanation: `It always starts with: <strong>${firstItem}</strong>`,
                flowTitle: flow.text, flowItems: flow.items
            };
        }

        function genNotIncluded() {
            let flow = currentActiveFlow;
            let availableOtherFlows = Object.values(allFlowsData).filter(f => f.text !== flow.text);
            if (availableOtherFlows.length === 0) return null;
            
            let randomOtherFlow = availableOtherFlows[Math.floor(Math.random() * availableOtherFlows.length)];
            let wrongItem = randomOtherFlow.items[Math.floor(Math.random() * randomOtherFlow.items.length)];
            
            let correct1 = flow.items[0];
            let correct2 = flow.items[flow.items.length - 1];

            return {
                question: `Which of the following is **NOT** part of ${flow.text}?`,
                options: [wrongItem, correct1, correct2],
                correctAnswer: 0,
                explanation: `The item <strong>${wrongItem}</strong> does not belong to this sequence.`,
                flowTitle: flow.text, flowItems: flow.items
            };
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function shuffleOptions(q) {
            let optionsWithIndex = q.options.map((opt, index) => ({
                text: opt,
                isCorrect: index === q.correctAnswer
            }));
            optionsWithIndex = shuffleArray(optionsWithIndex);
            return {
                question: q.question,
                options: optionsWithIndex.map(o => o.text),
                correctAnswer: optionsWithIndex.findIndex(o => o.isCorrect),
                explanation: q.explanation,
                flowTitle: q.flowTitle,
                flowItems: q.flowItems
            };
        }

        function startQuiz(flowId) {
            currentFlowId = flowId;
            currentActiveFlow = allFlowsData[flowId];
            
            generatedQuestions = [];
            for (let i = 0; i < QUESTIONS_PER_DRILL; i++) {
                let q = null;
                let attempts = 0;
                while (!q && attempts < 15) {
                    let rand = Math.random();
                    if (rand < 0.33) q = genWhatIsNext();
                    else if (rand < 0.66) q = genFirstAction();
                    else q = genNotIncluded();
                    attempts++;
                }
                if (q) {
                    generatedQuestions.push(shuffleOptions(q));
                } else {
                    i--;
                }
            }
            
            generatedQuestions = shuffleArray(generatedQuestions);

            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('scoreScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
            
            // Show Back and Side Panel buttons
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('panelToggleBtn').style.display = 'block';

            currentQ = 0;
            score = 0;
            errors = 0;
            
            closeSidePanel();
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            let fb = document.getElementById('feedbackBox');
            fb.className = 'feedback';
            fb.innerHTML = '';
            document.getElementById('nextBtn').style.display = 'none';
            
            let optsContainer = document.getElementById('optionsContainer');
            optsContainer.innerHTML = '';

            let q = generatedQuestions[currentQ];
            document.getElementById('qNumber').innerText = `Question ${currentQ + 1} of ${QUESTIONS_PER_DRILL}`;
            document.getElementById('qScore').innerText = `Correct: ${score} | Err: ${errors}`;
            document.getElementById('qText').innerText = q.question;
            
            updateSidePanelContent(q);

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (opt.includes('➔')) {
                    btn.style.direction = 'ltr';
                    btn.style.textAlign = 'left';
                    btn.style.lineHeight = '1.8'; 
                }
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            let q = generatedQuestions[currentQ];
            let allBtns = document.getElementById('optionsContainer').querySelectorAll('.option-btn');
            
            allBtns.forEach(btn => btn.disabled = true);

            let isCorrect = (selectedIndex === q.correctAnswer);

            let fb = document.getElementById('feedbackBox');
            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;
                fb.classList.add('show', 'success');
            } else {
                btnElement.classList.add('wrong');
                errors++;
                allBtns[q.correctAnswer].classList.add('correct');
                fb.classList.add('show', 'error');
            }

            fb.innerHTML = `
                <strong>${isCorrect ? 'Correct' : 'Incorrect'}</strong><br>
                <span>${q.explanation}</span>
                <div class="flow-box">
                    <h4>Word Bank / Flow (${q.flowTitle}):</h4>
                    ${renderFlowList(q.flowItems)}
                </div>
            `;
            
            document.getElementById('qScore').innerText = `Correct: ${score} | Err: ${errors}`;
            
            let nextBtn = document.getElementById('nextBtn');
            if (currentQ === QUESTIONS_PER_DRILL - 1) nextBtn.innerText = "Finish & See Results";
            else nextBtn.innerText = "Continue";
            nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < QUESTIONS_PER_DRILL) {
                loadQuestion();
            } else {
                showScore();
            }
        }

        function showScore() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('scoreScreen').style.display = 'block';
            
            document.getElementById('panelToggleBtn').style.display = 'none';
            closeSidePanel();
            
            let percentage = Math.round((score / QUESTIONS_PER_DRILL) * 100);
            let scoreEl = document.getElementById('finalScore');
            scoreEl.innerText = percentage + "%";
            
            document.getElementById('finalStats').innerHTML = `Correct: ${score} out of ${QUESTIONS_PER_DRILL}<br>Errors: ${errors}`;

            if(percentage >= 85) scoreEl.style.color = "var(--correct-color)";
            else scoreEl.style.color = "var(--wrong-color)";
        }

        function restartSameQuiz() {
            startQuiz(currentFlowId);
        }

        function goHome() {
            document.getElementById('scoreScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'block';
            
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('panelToggleBtn').style.display = 'none';
            closeSidePanel();
            
            currentQ = 0;
            score = 0;
            errors = 0;
        }

    </script>
</body>
</html>
