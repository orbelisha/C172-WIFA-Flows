<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="C172 Master">
    <meta name="mobile-web-app-capable" content="yes">
    <title>C-172 Knowledge Master</title>
    <style>
        /* =========================================================
           PREMIUM DESIGN SYSTEM (COLORS & VARIABLES)
           ========================================================= */
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary-color: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            --correct-color: #10b981;
            --correct-bg: rgba(16, 185, 129, 0.1);
            --wrong-color: #ef4444;
            --wrong-bg: rgba(239, 68, 68, 0.1);
            --border-color: rgba(203, 213, 225, 0.6);
            --shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 15px 50px rgba(37, 99, 235, 0.15);
            --highlight-bg: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            --highlight-border: #93c5fd;
            --highlight-text: #1e3a8a;
            --nav-bg: rgba(240, 244, 248, 0.85);
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #0b1120 0%, #111827 100%);
            --card-bg: rgba(30, 41, 59, 0.95);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #60a5fa;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            --border-color: rgba(51, 65, 85, 0.6);
            --shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 15px 50px rgba(96, 165, 250, 0.2);
            --highlight-bg: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            --highlight-border: #3b82f6;
            --highlight-text: #eff6ff;
            --nav-bg: rgba(11, 17, 32, 0.85);
        }

        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-top: calc(env(safe-area-inset-top, 40px) + 70px); 
            padding-bottom: env(safe-area-inset-bottom, 20px);
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* =========================================================
           TOP NAVIGATION (IOS GLASS EFFECT)
           ========================================================= */
        .top-nav {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: calc(env(safe-area-inset-top, 20px) + 60px);
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 12px 20px;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.4s ease;
        }

        .action-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex; align-items: center; justify-content: center;
        }

        .action-btn:hover, .action-btn:active {
            background: var(--primary-gradient);
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .nav-buttons-left { display: flex; gap: 12px; }
        #backBtn { display: none; }

        /* =========================================================
           TYPOGRAPHY & HEADERS
           ========================================================= */
        h1 { 
            color: var(--text-main); 
            margin-top: 0; margin-bottom: 5px; 
            text-align: center; 
            font-size: 2.2em; 
            font-weight: 800;
            letter-spacing: -0.5px; 
        }
        
        .subtitle { 
            color: var(--primary-color); 
            margin-bottom: 40px; 
            text-align: center; 
            font-weight: 700; 
            font-size: 0.9em; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
        }

        /* =========================================================
           MAIN CONTAINERS
           ========================================================= */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 850px;
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            padding: 40px;
            border: 1px solid var(--border-color);
            position: relative;
            transition: all 0.4s ease;
        }

        /* =========================================================
           CATEGORY GRIDS & CARDS
           ========================================================= */
        .parent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 10px; }
        
        .parent-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            border-radius: 20px;
            padding: 35px 20px;
            font-size: 1.3em;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .parent-card:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .category-section { margin-bottom: 45px; }
        .category-section:last-child { margin-bottom: 0; }
        
        .category-title { 
            color: var(--text-muted); 
            margin-top: 0; margin-bottom: 20px; 
            font-size: 1.1em; 
            text-align: left; 
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: 700;
        }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            border-radius: 16px;
            padding: 20px 15px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        
        .menu-btn.highlight-blue {
            background: var(--highlight-bg);
            border-color: var(--highlight-border);
            color: var(--highlight-text);
        }

        .menu-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .menu-btn small { 
            font-size: 0.75em; 
            color: var(--text-muted); 
            margin-top: 8px; 
            font-weight: 500; 
            letter-spacing: 0.5px;
        }
        
        .menu-btn.highlight-blue small { color: var(--primary-color); }

        /* =========================================================
           QUIZ & STUDY SCREENS
           ========================================================= */
        #studyScreen, #quizScreen, #scoreScreen { display: none; }
        
        .study-title { color: var(--text-main); margin-top: 0; text-transform: uppercase; font-size: 1.8em; font-weight: 800; letter-spacing: -0.5px; }
        .study-subtitle { font-size: 1em; color: var(--primary-color); margin-bottom: 25px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .question-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 30px; font-weight: 700; color: var(--text-muted); 
            font-size: 0.9em; border-bottom: 1px solid var(--border-color); 
            padding-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;
        }
        
        .question-text { font-size: 1.4em; font-weight: 800; margin-bottom: 30px; line-height: 1.4; color: var(--text-main); }
        
        .options { display: flex; flex-direction: column; gap: 14px; }
        
        .option-btn { 
            background: var(--card-bg); 
            border: 2px solid var(--border-color); 
            color: var(--text-main); 
            border-radius: 16px; 
            padding: 18px 20px; 
            font-size: 1.1em; 
            text-align: left; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-weight: 600;
            line-height: 1.5; 
            display: flex; align-items: center; 
        }
        
        .option-btn:hover:not(:disabled) { 
            border-color: var(--primary-color); 
            background: rgba(37, 99, 235, 0.02);
        }
        .option-btn:disabled { cursor: default; }
        
        .option-btn.correct { background: var(--correct-bg); border-color: var(--correct-color); color: var(--correct-color); }
        .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-color); color: var(--wrong-color); }

        .feedback { margin-top: 30px; padding: 25px; border-radius: 16px; font-size: 1.05em; display: none; line-height: 1.6; font-weight: 500; }
        .feedback.show { display: block; animation: fadeIn 0.4s ease; }
        .feedback.success { background: var(--correct-bg); color: var(--correct-color); border: 1px solid rgba(16, 185, 129, 0.3); }
        .feedback.error { background: var(--wrong-bg); color: var(--wrong-color); border: 1px solid rgba(239, 68, 68, 0.3); }

        .flow-box { background: rgba(0,0,0,0.02); border-left: 4px solid var(--primary-color); padding: 20px 25px; margin-top: 20px; border-radius: 0 12px 12px 0; }
        body.dark-mode .flow-box { background: rgba(255,255,255,0.02); }
        
        .flow-box h4 { margin: 0 0 12px 0; color: var(--primary-color); font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        .flow-box ol { margin: 0; padding-left: 20px; color: var(--text-main); font-weight: 600; font-size: 1.05em; }
        .flow-box li { margin-bottom: 8px; line-height: 1.4; }

        .next-btn { 
            background: var(--primary-gradient); 
            color: #ffffff; 
            border: none; 
            padding: 20px 30px; 
            font-size: 1.1em; 
            border-radius: 16px; 
            cursor: pointer; 
            font-weight: 800; 
            margin-top: 35px; 
            width: 100%; 
            display: none; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
        }
        .next-btn:active { transform: scale(0.97); }
        .next-btn:hover { box-shadow: 0 15px 30px rgba(37, 99, 235, 0.4); }

        /* Score Screen */
        .score-val { font-size: 4.5em; font-weight: 900; color: var(--primary-color); margin: 20px 0; letter-spacing: -2px; }
        .home-btn { background: transparent; color: var(--text-main); border: 2px solid var(--border-color); box-shadow: none; }
        .home-btn:hover { background: var(--hover-color); border-color: var(--text-muted); box-shadow: none;}

        /* =========================================================
           LEFT MENU & RIGHT SIDE PANEL (DRAWERS)
           ========================================================= */
        #leftMenuOverlay, #panelOverlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
            z-index: 998; opacity: 0; transition: opacity 0.3s ease; cursor: pointer;
        }
        #leftMenuOverlay.open, #panelOverlay.open { display: block; opacity: 1; }

        #leftNavMenu, #flowSidePanel {
            position: fixed; top: 0; height: 100vh; background: var(--card-bg);
            box-shadow: 0 0 30px rgba(0,0,0,0.15); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        #leftNavMenu { left: -320px; width: 300px; max-width: 80vw; border-right: 1px solid var(--border-color); }
        #leftNavMenu.open { left: 0; }
        
        #flowSidePanel { right: -340px; width: 320px; max-width: 85vw; border-left: 1px solid var(--border-color); }
        #flowSidePanel.open { right: 0; }

        .left-menu-content, .panel-content { padding: calc(env(safe-area-inset-top, 20px) + 30px) 25px 80px 25px; }
        .left-menu-content h3, .panel-content h3 { 
            color: var(--primary-color); margin-top: 0; margin-bottom: 20px; 
            font-size: 1.1em; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; 
            text-transform: uppercase; letter-spacing: 1px; font-weight: 800;
        }

        .left-menu-btn {
            background: none; border: none; width: 100%; text-align: left; padding: 16px 12px;
            font-size: 1.1em; color: var(--text-main); font-weight: 600; cursor: pointer;
            border-bottom: 1px solid var(--border-color); transition: 0.2s; border-radius: 8px;
        }
        .left-menu-btn:hover { background: var(--hover-color); color: var(--primary-color); padding-left: 18px; border-bottom-color: transparent;}

        .accordion-btn {
            background: none; border: none; width: 100%; text-align: left; padding: 18px 12px;
            font-size: 0.95em; color: var(--text-main); font-weight: 700; cursor: pointer;
            border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between;
            align-items: center; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .accordion-btn:hover { color: var(--primary-color); }
        .accordion-btn.active { color: var(--primary-color); border-bottom-color: transparent; }
        
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: rgba(0,0,0,0.02); border-radius: 0 0 12px 12px; margin-bottom: 5px; }
        body.dark-mode .accordion-content { background: rgba(255,255,255,0.02); }
        .accordion-content button {
            width: 100%; text-align: left; padding: 14px 10px 14px 25px; background: none; border: none;
            font-size: 1em; color: var(--text-muted); cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .accordion-content button:hover { color: var(--primary-color); padding-left: 30px; }

        .panel-content ol { padding-left: 20px; color: var(--text-main); font-size: 1.05em; line-height: 1.6; margin: 0; font-weight: 600; }
        .panel-content li { margin-bottom: 12px; }

        /* Floating Panel Toggle Button */
        #panelToggleBtn { 
            position: fixed; top: 50%; right: 0; transform: translateY(-50%); 
            background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);
            border-right: none; padding: 25px 12px; border-radius: 16px 0 0 16px; cursor: pointer; 
            z-index: 1001; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 0.85em; font-weight: 800; display: none; outline: none; 
            writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 2px; text-transform: uppercase; 
            box-shadow: -4px 0 15px rgba(0,0,0,0.05);
        }
        #panelToggleBtn:hover { color: var(--primary-color); }
        #panelToggleBtn.open { right: 320px; background: var(--primary-gradient); color: #fff; border-color: transparent; }

        /* Keyframes */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (max-width: 600px) {
            .container { padding: 30px 20px; border-radius: 20px; }
            .menu-grid { grid-template-columns: 1fr; } 
            .menu-btn { padding: 20px 15px; font-size: 1.15em; }
            #panelToggleBtn.open { right: 85vw; }
            #flowSidePanel { width: 85vw; }
        }
    </style>
</head>
<body>

    <!-- Fixed Top Navigation -->
    <div class="top-nav">
        <div class="nav-buttons-left">
            <button class="action-btn" id="menuBtn" onclick="toggleLeftMenu()">MENU</button>
            <button class="action-btn" id="backBtn" onclick="goBackLogic()">BACK</button>
        </div>
        <button class="action-btn" id="themeToggleBtn" onclick="toggleTheme()">DARK</button>
    </div>

    <!-- Left Global Navigation Menu -->
    <div id="leftMenuOverlay" onclick="closeLeftMenu()"></div>
    <div id="leftNavMenu">
        <div class="left-menu-content" id="leftNavMenuContent">
            <!-- Dynamically populated by JS -->
        </div>
    </div>

    <!-- Right Study Material Panel -->
    <div id="panelOverlay" onclick="closeSidePanel()"></div>
    <button id="panelToggleBtn" onclick="toggleSidePanel()">Study Material</button>
    <div id="flowSidePanel">
        <div class="panel-content">
            <h3 id="sidePanelTitle">Title</h3>
            <div id="sidePanelList"></div>
        </div>
    </div>

    <h1 id="mainTitle">C-172 Master</h1>
    <div class="subtitle" id="mainSubtitle">Flight Procedures & Memory Items</div>

    <!-- MAIN CATEGORY CONTAINER -->
    <div class="container" id="dynamicContent"></div>

    <!-- PRE-QUIZ STUDY SCREEN -->
    <div class="container" id="studyScreen">
        <h2 class="study-title" id="studyScreenTitle">Title</h2>
        <div class="study-subtitle" id="studyScreenSubtitle">Subtitle</div>
        <div class="flow-box" style="margin-bottom: 35px;">
            <div id="studyScreenContent"></div>
        </div>
        <button class="next-btn" style="display: block; width: 100%;" onclick="startQuizFromStudy()">Start Drill</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="container" id="quizScreen">
        <div class="question-header">
            <span id="qNumber">Question 1 of 15</span>
            <span id="qScore" style="color: var(--primary-color);">Score: 0</span>
        </div>
        <div class="question-text" id="qText">Loading question...</div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedbackBox"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Continue</button>
    </div>

    <!-- SCORE SCREEN -->
    <div class="container" id="scoreScreen">
        <h2 style="margin-top: 0; text-transform: uppercase; font-weight: 800;">Drill Completed</h2>
        <div class="score-val" id="finalScore">0%</div>
        <div id="finalStats" style="color: var(--text-muted); margin-bottom: 35px; font-size: 1.2em; font-weight: 600;"></div>
        <button class="next-btn" style="display: block;" onclick="restartSameQuiz()">Retry Drill</button>
        <button class="next-btn home-btn" style="display: block;" onclick="goBackLogic()">Back to Menu</button>
    </div>

    <script>
        const QUESTIONS_PER_DRILL = 15;

        // Structured Database
        const appDatabase = {
            "Checklists": {
                "Normal Procedures": [
                    { id: "EngineStart", title: "Engine Starting", text: "Normal Start", items: ["Passenger Briefing COMPLETE", "Doors and Seatbelts SECURED", "Parking Brake SET", "Fuel Selector BOTH", "Carburetor Heat COLD", "Mixture FULL RICH", "Primer 2-5 STROKES & LOCK", "Master Switch ON", "Lights AS REQUIRED", "Throttle OPEN 1/8 INCH", "Prop Area CLEAR", "Starter ENGAGE", "Throttle 1,000 RPM & ADJUST", "Oil Pressure GREEN", "Mixture LEAN FOR TAXI", "Radio Master ON"] },
                    { id: "PreLineup", title: "Pre-Lineup", text: "Before Takeoff Roll", items: ["Trim/Flaps SET FOR TAKEOFF", "Lights AS REQUIRED", "Aux Fuel Pump ON", "Mixture RICH <3000 D.A.", "Carburetor Heat OFF", "Doors, Windows & Seatbelts SECURED", "Fuel Timer SET", "Traffic CLEAR", "Assigned RWY/HDG CONFIRMED"] },
                    { id: "AfterLanding", title: "After Landing", text: "Runway Cleared", items: ["Flaps UP", "Mixture LEAN FOR TAXI", "Carburetor Heat OFF", "Trim RESET FOR TAKEOFF", "Pitot Heat OFF", "Taxi Light ON", "Landing Light OFF"] },
                    { id: "ShutDown", title: "Shut Down", text: "Engine Shutdown", items: ["Parking Brake SET", "Radio Master OFF", "Exterior Lights OFF", "Cabin / Panel Lights OFF", "Throttle IDLE", "Mixture IDLE CUTOFF", "Ignition Switch OFF & KEY OUT", "Master Switch OFF"] },
                    { id: "Securing", title: "Securing", text: "Airplane Securing", items: ["Lights ALL ON", "Tie Downs & Chocks APPLY", "Control Lock & Pitot Cover INSTALL", "Fuel Selector LEFT or RIGHT", "Cabin Air/Heat OFF", "Windows CLOSE", "Flight Plan CLOSE", "Binder & Fuel Load RECORD", "FSP & Squawks COMPLETE", "Garbage VERIFY CLEAN"] }
                ],
                "Emergency Procedures": [
                    { id: "EngineFireStart", title: "Fire (Start)", text: "Engine Fire During Start", items: ["Cranking CONTINUE", "If Fails: Throttle FULL OPEN", "Mixture IDLE CUTOFF", "Cranking CONTINUE for 3 MINS", "Fire Extinguisher OBTAIN", "Master/Ignition/Fuel OFF"] },
                    { id: "ElecFire", title: "Electrical Fire", text: "Smoke in Cabin", items: ["Master Switch OFF", "Cabin Air & Heat OFF", "Fire Extinguisher CONSIDER USING"] }
                ]
            },
            "Flows": {
                "Ground": [
                    { id: "SixPlusSix", title: "6+6 Flow", text: "Before Taxi Check", isMemory: true, items: ["Transponder Code / Clearance", "Barometers", "Altitude Pre-Select(s)", "Comms", "NAVS", "GPS (and MFD ranges)"] },
                    { id: "HalfAndHalf", title: "1/2 & 1/2 Flow", text: "Before Takeoff", isMemory: true, items: ["Controls FREE & CORRECT", "Circuit Breakers VERIFY IN", "Trims Reset for Takeoff", "Lights", "GPS #2", "Gauges", "Magnetos", "Carb Heat", "Idle Check"] }
                ],
                "Air": [
                    { id: "Climb", title: "Climb Flow", text: "500' AGL", items: ["Flaps UP", "Taxi Light OFF", "Engine Instruments CHECK"] },
                    { id: "DIMS", title: "DIMS", text: "Cruise Checklist", isMemory: true, items: ["D - Directional Gyro ADJUST", "I - Instruments CHECK", "M - Mixture LEAN", "S - Switches AS REQUIRED", "Next Frequencies PREPARE", "Map Range AS APPROPRIATE", "TOD DETERMINE"] },
                    { id: "FourCs", title: "4 C's", text: "Pre-Maneuver", isMemory: true, items: ["Clearing Turns PERFORM", "Non Congested Area VERIFY", "Checklist PERFORM", "Declare PERFORM"] },
                    { id: "ABC", title: "ABC", text: "Descent", isMemory: true, items: ["A - ATIS/AWOS OBTAIN", "B - Brief PERFORM", "C - Checklist PERFORM"] },
                    { id: "CGUMPS", title: "CGUMPS", text: "Final Check", isMemory: true, items: ["C - Clearance & Carb Heat OBTAIN", "G - Gas BOTH", "U - Undercarriage DOWN", "M - Mixture RICH", "P - Pumps/Primer ON/LOCKED", "S - Seatbelts & Switches CHECK"] }
                ],
                "Emergencies": [
                    { id: "ABCD", title: "ABCD", text: "Engine Failure in Flight", isMemory: true, items: ["A - Airspeed 68 KIAS", "B - Best Place to Land", "C - Checklist", "D - Declare"] }
                ]
            },
            "Weather": {
                "TAF / METAR": [
                    { id: "WxPrecip", title: "Precipitation", text: "Weather Codes", isMemory: true, items: ["RA - Rain", "SN - Snow", "DZ - Drizzle", "GR - Hail", "GS - Small Hail", "PL - Ice Pellets"] },
                    { id: "WxObscure", title: "Obscurations", text: "Visibility Restrictions", isMemory: true, items: ["FG - Fog", "BR - Mist", "HZ - Haze", "FU - Smoke", "DU - Dust", "SA - Sand", "VA - Volcanic Ash"] },
                    { id: "WxDesc", title: "Descriptors", text: "Weather Modifiers", isMemory: true, items: ["TS - Thunderstorm", "SH - Showers", "FZ - Freezing", "BL - Blowing", "PR - Partial", "BC - Patches", "MI - Shallow"] }
                ]
            },
            "Acronyms": {
                "Emergencies": [
                    { id: "WOSSS", title: "WOSSS", text: "Forced Landing Criteria", isMemory: true, items: ["W - Wind", "O - Obstructions", "S - Size", "S - Shape", "S - Surface"] },
                    { id: "ABCDE", title: "ABCDE", text: "Emergency Landing", isMemory: true, items: ["A - Airspeed", "B - Best Field", "C - Checklist", "D - Declare", "E - Execute"] }
                ],
                "Equipment & Rules": [
                    { id: "ATOMATO", title: "A TOMATO FLAMES", text: "VFR Day Equipment", isMemory: true, items: ["A - Altimeter", "T - Tachometer", "O - Oil Pressure", "M - Manifold Pressure", "A - Airspeed", "T - Temperature Gauge", "O - Oil Temp", "F - Fuel Gauge", "L - Landing Gear Pos", "A - Anti-collision Lights", "M - Magnetic Compass", "E - ELT", "S - Seatbelts"] },
                    { id: "FLAPS", title: "FLAPS", text: "VFR Night Equipment", isMemory: true, items: ["F - Fuses", "L - Landing Light", "A - Anti-collision", "P - Position lights", "S - Source of power"] },
                    { id: "ARROW", title: "ARROW", text: "Required Documents", isMemory: true, items: ["A - Airworthiness Certificate", "R - Registration", "R - Radio license", "O - Operating limitations", "W - Weight and balance"] }
                ]
            }
        };

        // Navigation State
        let currentParent = null;
        let currentActiveFlow = null;
        let generatedQuestions = [];
        let currentQ = 0;
        let score = 0;
        let errors = 0;
        let isAnswered = false;

        // Theme
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeToggleBtn').innerText = isDark ? "LIGHT" : "DARK";
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeToggleBtn').innerText = "LIGHT";
        }

        // ================== HISTORY API (Swipe Back) ==================
        window.addEventListener('popstate', (e) => {
            if (!e.state || e.state.page === 'home') {
                renderHome(false);
            } else if (e.state.page === 'category') {
                renderCategory(e.state.cat, false);
            } else if (e.state.page === 'study') {
                let foundQuiz = findQuizById(e.state.quizId);
                if (foundQuiz) renderStudyScreen(foundQuiz, false);
                else renderHome(false);
            } else if (e.state.page === 'quiz') {
                let foundQuiz = findQuizById(e.state.quizId);
                if (foundQuiz) startQuiz(foundQuiz, false);
                else renderHome(false);
            }
        });

        function findQuizById(id) {
            for (const cat in appDatabase) {
                for (const subCat in appDatabase[cat]) {
                    for (const quiz of appDatabase[cat][subCat]) {
                        if (quiz.id === id) return quiz;
                    }
                }
            }
            return null;
        }

        function goBackLogic() { history.back(); }

        // ================== UI RENDER FUNCTIONS ==================

        function buildLeftMenu() {
            const menuDiv = document.getElementById('leftNavMenuContent');
            menuDiv.innerHTML = '<h3>Menu</h3><button class="left-menu-btn" onclick="navigateTo(\'Home\')">Main Dashboard</button>';

            Object.keys(appDatabase).forEach(catName => {
                const accBtn = document.createElement('button');
                accBtn.className = 'accordion-btn';
                accBtn.innerHTML = `${catName} <span class="arrow">▼</span>`;
                
                const accContent = document.createElement('div');
                accContent.className = 'accordion-content';
                
                Object.keys(appDatabase[catName]).forEach(subCat => {
                    appDatabase[catName][subCat].forEach(quizObj => {
                        const itemBtn = document.createElement('button');
                        itemBtn.innerText = quizObj.title;
                        itemBtn.onclick = () => { 
                            closeLeftMenu(); 
                            renderStudyScreen(quizObj, true); 
                        };
                        accContent.appendChild(itemBtn);
                    });
                });

                accBtn.onclick = function() {
                    this.classList.toggle('active');
                    if (accContent.style.maxHeight) {
                        accContent.style.maxHeight = null;
                        this.querySelector('.arrow').innerText = '▼';
                    } else {
                        accContent.style.maxHeight = accContent.scrollHeight + "px";
                        this.querySelector('.arrow').innerText = '▲';
                    }
                };

                menuDiv.appendChild(accBtn);
                menuDiv.appendChild(accContent);
            });
        }

        function renderHome(pushToHistory = true) {
            currentParent = null;
            hideAllScreens();
            document.getElementById('dynamicContent').style.display = 'block';
            
            document.getElementById('mainTitle').innerText = "C-172 Master";
            document.getElementById('mainSubtitle').innerText = "Select Training Category";

            const container = document.getElementById('dynamicContent');
            container.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'parent-grid';

            Object.keys(appDatabase).forEach(catName => {
                const btn = document.createElement('button');
                btn.className = 'parent-card';
                btn.innerText = catName;
                btn.onclick = () => renderCategory(catName, true);
                grid.appendChild(btn);
            });

            container.appendChild(grid);
            if (pushToHistory) history.pushState({ page: 'home' }, '');
        }

        function renderCategory(catName, pushToHistory = true) {
            currentParent = catName;
            hideAllScreens();
            document.getElementById('dynamicContent').style.display = 'block';
            document.getElementById('backBtn').style.display = 'flex';
            
            document.getElementById('mainTitle').innerText = catName;
            document.getElementById('mainSubtitle').innerText = "Select specific drill";

            const container = document.getElementById('dynamicContent');
            container.innerHTML = '';

            const subCats = appDatabase[catName];
            Object.keys(subCats).forEach(subCatName => {
                const section = document.createElement('div');
                section.className = 'category-section';
                
                const header = document.createElement('h3');
                header.className = 'category-title';
                header.innerText = subCatName;
                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'menu-grid';

                subCats[subCatName].forEach(quizObj => {
                    const btn = document.createElement('button');
                    btn.className = 'menu-btn';
                    if (quizObj.isMemory) btn.classList.add('highlight-blue');
                    btn.innerHTML = `${quizObj.title} <small>${quizObj.text}</small>`;
                    btn.onclick = () => renderStudyScreen(quizObj, true);
                    grid.appendChild(btn);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });

            if (pushToHistory) history.pushState({ page: 'category', cat: catName }, '');
        }

        function renderStudyScreen(quizObj, pushToHistory = true) {
            currentActiveFlow = quizObj;
            hideAllScreens();
            
            document.getElementById('studyScreen').style.display = 'block';
            document.getElementById('backBtn').style.display = 'flex';

            document.getElementById('mainTitle').innerText = quizObj.title;
            document.getElementById('mainSubtitle').innerText = "Study Material";

            document.getElementById('studyScreenTitle').innerText = quizObj.title;
            document.getElementById('studyScreenSubtitle').innerText = quizObj.text;
            document.getElementById('studyScreenContent').innerHTML = renderFlowList(quizObj.items);

            if (pushToHistory) {
                history.pushState({ page: 'study', quizId: quizObj.id }, '');
            }
        }

        function startQuizFromStudy() {
            startQuiz(currentActiveFlow, true);
        }

        function hideAllScreens() {
            document.getElementById('dynamicContent').style.display = 'none';
            document.getElementById('studyScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('scoreScreen').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('panelToggleBtn').style.display = 'none';
            closeSidePanel();
        }

        // Left Navigation Menu
        function toggleLeftMenu() {
            document.getElementById('leftNavMenu').classList.add('open');
            document.getElementById('leftMenuOverlay').classList.add('open');
        }
        function closeLeftMenu() {
            document.getElementById('leftNavMenu').classList.remove('open');
            document.getElementById('leftMenuOverlay').classList.remove('open');
        }
        function navigateTo(target) {
            closeLeftMenu();
            if (target === 'Home') renderHome();
            else renderCategory(target);
        }

        // Right Side Panel
        function toggleSidePanel() {
            const panel = document.getElementById('flowSidePanel');
            const btn = document.getElementById('panelToggleBtn');
            const overlay = document.getElementById('panelOverlay');
            
            panel.classList.toggle('open');
            btn.classList.toggle('open');
            overlay.classList.toggle('open');
            
            btn.innerText = panel.classList.contains('open') ? 'Hide Material' : 'Study Material';
        }
        function updateSidePanelContent(q) {
            document.getElementById('sidePanelTitle').innerText = q.flowTitle;
            document.getElementById('sidePanelList').innerHTML = renderFlowList(q.flowItems);
        }
        function closeSidePanel() {
            document.getElementById('flowSidePanel').classList.remove('open');
            const btn = document.getElementById('panelToggleBtn');
            btn.classList.remove('open');
            btn.innerText = 'Study Material';
            document.getElementById('panelOverlay').classList.remove('open');
        }

        // ================== QUESTION GENERATORS ==================

        function getRandomOtherItems(currentFlow, count) {
            let allItems = [];
            Object.values(appDatabase).forEach(cat => Object.values(cat).forEach(subCat => subCat.forEach(flow => {
                if (flow.title !== currentFlow.title) allItems = allItems.concat(flow.items);
            })));
            let selected = [];
            for(let i=0; i<count; i++) selected.push(allItems[Math.floor(Math.random() * allItems.length)]);
            return selected;
        }

        function genWhatIsNext() {
            let flow = currentActiveFlow;
            if (flow.items.length < 2) return null;
            let idx = Math.floor(Math.random() * (flow.items.length - 1));
            let currentItem = flow.items[idx];
            let nextItem = flow.items[idx + 1];
            
            let wrong1 = flow.items[(idx + 2) % flow.items.length];
            let wrong2 = getRandomOtherItems(flow, 1)[0];
            if(wrong1 === nextItem) wrong1 = "Master Switch OFF";

            return {
                question: `In "${flow.title}", what comes immediately after:\n"${currentItem}"?`,
                options: [nextItem, wrong1, wrong2],
                correctAnswer: 0,
                explanation: `The item that immediately follows is: <strong>${nextItem}</strong>`,
                flowTitle: flow.title, flowItems: flow.items
            };
        }

        function genFirstAction() {
            let flow = currentActiveFlow;
            let firstItem = flow.items[0];
            let wrong1 = flow.items[1] || "Throttle IDLE";
            let wrong2 = flow.items[flow.items.length - 1] || "Mixture CUTOFF";
            
            return {
                question: `What is the **first** item in "${flow.title}"?`,
                options: [firstItem, wrong1, wrong2],
                correctAnswer: 0,
                explanation: `It always starts with: <strong>${firstItem}</strong>`,
                flowTitle: flow.title, flowItems: flow.items
            };
        }

        function genNotIncluded() {
            let flow = currentActiveFlow;
            let wrongItem = getRandomOtherItems(flow, 1)[0] || "Declare Emergency";
            let correct1 = flow.items[0];
            let correct2 = flow.items[flow.items.length - 1] || flow.items[1];

            return {
                question: `Which of the following is **NOT** part of "${flow.title}"?`,
                options: [wrongItem, correct1, correct2],
                correctAnswer: 0,
                explanation: `The item <strong>${wrongItem}</strong> does not belong to this sequence.`,
                flowTitle: flow.title, flowItems: flow.items
            };
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function shuffleOptions(q) {
            let optionsWithIndex = q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.correctAnswer }));
            optionsWithIndex = shuffleArray(optionsWithIndex);
            return {
                question: q.question,
                options: optionsWithIndex.map(o => o.text),
                correctAnswer: optionsWithIndex.findIndex(o => o.isCorrect),
                explanation: q.explanation,
                flowTitle: q.flowTitle,
                flowItems: q.flowItems
            };
        }

        function startQuiz(quizObj, pushToHistory = true) {
            currentActiveFlow = quizObj;
            generatedQuestions = [];
            
            for (let i = 0; i < QUESTIONS_PER_DRILL; i++) {
                let q = null, attempts = 0;
                while (!q && attempts < 15) {
                    let rand = Math.random();
                    if (rand < 0.33) q = genWhatIsNext();
                    else if (rand < 0.66) q = genFirstAction();
                    else q = genNotIncluded();
                    attempts++;
                }
                if (q) generatedQuestions.push(shuffleOptions(q));
                else i--;
            }
            generatedQuestions = shuffleArray(generatedQuestions);

            hideAllScreens();
            document.getElementById('quizScreen').style.display = 'block';
            document.getElementById('backBtn').style.display = 'flex';
            document.getElementById('panelToggleBtn').style.display = 'block';
            
            document.getElementById('mainTitle').innerText = quizObj.title;
            document.getElementById('mainSubtitle').innerText = "Drill in progress";

            currentQ = 0; score = 0; errors = 0;
            loadQuestion();

            if (pushToHistory) history.pushState({ page: 'quiz', quizId: quizObj.id }, '');
        }

        function loadQuestion() {
            isAnswered = false;
            let fb = document.getElementById('feedbackBox');
            fb.className = 'feedback';
            fb.innerHTML = '';
            document.getElementById('nextBtn').style.display = 'none';
            
            let optsContainer = document.getElementById('optionsContainer');
            optsContainer.innerHTML = '';

            let q = generatedQuestions[currentQ];
            document.getElementById('qNumber').innerText = `Question ${currentQ + 1} of ${QUESTIONS_PER_DRILL}`;
            document.getElementById('qScore').innerText = `Score: ${score}`;
            document.getElementById('qText').innerText = q.question;
            
            updateSidePanelContent(q);

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (opt.includes('➔')) { btn.style.direction = 'ltr'; btn.style.textAlign = 'left'; btn.style.lineHeight = '1.8'; }
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            let q = generatedQuestions[currentQ];
            let allBtns = document.getElementById('optionsContainer').querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);

            let isCorrect = (selectedIndex === q.correctAnswer);
            let fb = document.getElementById('feedbackBox');

            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;
                fb.classList.add('show', 'success');
            } else {
                btnElement.classList.add('wrong');
                errors++;
                allBtns[q.correctAnswer].classList.add('correct');
                fb.classList.add('show', 'error');
            }

            fb.innerHTML = `
                <strong>${isCorrect ? 'Correct' : 'Incorrect'}</strong><br>
                <span>${q.explanation}</span>
                <div class="flow-box">
                    <h4>Study Material (${q.flowTitle}):</h4>
                    ${renderFlowList(q.flowItems)}
                </div>
            `;
            
            document.getElementById('qScore').innerText = `Score: ${score}`;
            
            let nextBtn = document.getElementById('nextBtn');
            if (currentQ === QUESTIONS_PER_DRILL - 1) nextBtn.innerText = "Finish & See Results";
            else nextBtn.innerText = "Continue";
            nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < QUESTIONS_PER_DRILL) loadQuestion();
            else showScore();
        }

        function showScore() {
            hideAllScreens();
            document.getElementById('scoreScreen').style.display = 'block';
            document.getElementById('backBtn').style.display = 'flex';
            
            let percentage = Math.round((score / QUESTIONS_PER_DRILL) * 100);
            let scoreEl = document.getElementById('finalScore');
            scoreEl.innerText = percentage + "%";
            
            document.getElementById('finalStats').innerHTML = `Correct: ${score} out of ${QUESTIONS_PER_DRILL}<br>Errors: ${errors}`;
            if(percentage >= 85) scoreEl.style.color = "var(--correct-color)";
            else scoreEl.style.color = "var(--wrong-color)";
        }

        function restartSameQuiz() { startQuiz(currentActiveFlow, false); }

        // Initialize App
        document.addEventListener("DOMContentLoaded", () => {
            buildLeftMenu();
            history.replaceState({ page: 'home' }, '');
            renderHome(false);
        });

    </script>
</body>
</html>
