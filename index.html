<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="C172 Training">
    <title>C-172 Knowledge Master</title>
    <style>
        /* =========================================================
           CLEAN, COMPACT & PROFESSIONAL DESIGN SYSTEM
           ========================================================= */
        :root {
            --bg-color: #f4f4f5;
            --card-bg: #ffffff;
            --text-main: #18181b;
            --text-muted: #71717a;
            --primary-color: #0284c7; 
            --hover-color: #e4e4e7;
            --correct-color: #16a34a;
            --correct-bg: #dcfce7;
            --wrong-color: #dc2626;
            --wrong-bg: #fee2e2;
            --border-color: #e4e4e7;
        }

        body.dark-mode {
            --bg-color: #09090b;
            --card-bg: #18181b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --primary-color: #38bdf8;
            --hover-color: #27272a;
            --correct-color: #4ade80;
            --correct-bg: rgba(22, 163, 74, 0.2);
            --wrong-color: #f87171;
            --wrong-bg: rgba(220, 38, 38, 0.2);
            --border-color: #27272a;
        }

        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-top: calc(env(safe-area-inset-top, 20px) + 60px); 
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        /* =========================================================
           TOP NAVIGATION
           ========================================================= */
        .top-nav {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: calc(env(safe-area-inset-top, 20px) + 55px);
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 10px 15px;
            z-index: 100;
        }

        .action-btn {
            background-color: var(--bg-color);
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Instant touch feedback for iOS */
        .action-btn:active { 
            opacity: 0.6; 
            transition: none !important; 
        }
        
        .nav-buttons-left { display: flex; gap: 8px; }
        #backBtn { display: none; }
        
        #themeToggleBtn { font-size: 1.1rem; }

        /* =========================================================
           CONTAINERS & LAYOUT
           ========================================================= */
        .container-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 15px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            padding: 25px 20px;
            border: 1px solid var(--border-color);
        }

        /* Typography */
        h1 { margin: 0 0 5px 0; text-align: center; font-size: 1.5rem; color: var(--text-main); }
        .subtitle { color: var(--text-muted); margin-bottom: 25px; text-align: center; font-size: 0.9rem; font-weight: 500; }
        
        /* Grids & Buttons */
        .parent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
        
        .parent-card {
            background-color: var(--card-bg);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 8px;
            padding: 20px 15px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        
        .category-section { margin-bottom: 30px; }
        .category-title { color: var(--text-muted); margin: 0 0 10px 0; font-size: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; text-transform: uppercase; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        
        .menu-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px 10px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            min-height: 60px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .menu-btn small { display: block; font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; font-weight: 400; }

        /* Instant touch feedback classes */
        .parent-card:active, .menu-btn:active, .option-btn:active:not(:disabled) { 
            background-color: var(--hover-color) !important; 
            transition: none !important; 
        }

        /* =========================================================
           STUDY & QUIZ SCREENS
           ========================================================= */
        #studyScreen, #quizScreen, #scoreScreen { display: none; }
        
        .study-title { font-size: 1.3rem; margin: 0 0 5px 0; color: var(--text-main); }
        .study-subtitle { font-size: 0.95rem; color: var(--primary-color); margin-bottom: 15px; font-weight: 600; }

        .question-header { display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; line-height: 1.4; color: var(--text-main); }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        
        .option-btn { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            color: var(--text-main); 
            border-radius: 8px; 
            padding: 14px 15px; 
            font-size: 1rem; 
            text-align: left; 
            font-weight: 500;
            line-height: 1.4; 
            transition: border-color 0.2s;
        }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-color); color: var(--correct-color); font-weight: bold; }
        .option-btn.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-color); color: var(--wrong-color); font-weight: bold; }

        .feedback { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 0.95rem; display: none; line-height: 1.5; }
        .feedback.show { display: block; }
        .feedback.success { background-color: var(--correct-bg); color: var(--correct-color); border: 1px solid var(--correct-color); }
        .feedback.error { background-color: var(--wrong-bg); color: var(--wrong-color); border: 1px solid var(--wrong-color); }

        .flow-box { background-color: var(--bg-color); border-left: 4px solid var(--primary-color); padding: 15px; margin-top: 15px; border-radius: 0 6px 6px 0; }
        .flow-box h4 { margin: 0 0 10px 0; color: var(--primary-color); font-size: 0.9rem; text-transform: uppercase; }
        .flow-box ul { margin: 0; padding-left: 20px; color: var(--text-main); font-weight: 500; font-size: 0.95rem; }
        .flow-box li { margin-bottom: 6px; }

        .next-btn { 
            background-color: var(--primary-color); 
            color: #ffffff; 
            border: none; 
            padding: 16px; 
            font-size: 1rem; 
            border-radius: 8px; 
            font-weight: 600; 
            margin-top: 25px; 
            width: 100%; 
            display: none; 
            text-transform: uppercase;
        }
        .next-btn:active { opacity: 0.8; transition: none !important; }

        .score-val { font-size: 3rem; font-weight: bold; color: var(--primary-color); margin: 10px 0; }
        .home-btn { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); margin-top: 15px; }

        /* =========================================================
           SIDE MENUS
           ========================================================= */
        #leftMenuOverlay, #panelOverlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 998; opacity: 0; transition: opacity 0.2s ease;
        }
        #leftMenuOverlay.open, #panelOverlay.open { display: block; opacity: 1; }

        #leftNavMenu, #flowSidePanel {
            position: fixed; top: 0; height: 100vh; background-color: var(--card-bg);
            transition: 0.3s ease; z-index: 1000; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        #leftNavMenu { left: -280px; width: 280px; border-right: 1px solid var(--border-color); }
        #leftNavMenu.open { left: 0; }
        
        #flowSidePanel { right: -300px; width: 300px; border-left: 1px solid var(--border-color); }
        #flowSidePanel.open { right: 0; }

        .panel-content { padding: calc(env(safe-area-inset-top, 20px) + 20px) 20px; }
        .panel-content h3 { color: var(--primary-color); margin: 0 0 15px 0; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; text-transform: uppercase; }

        .accordion-btn {
            background: none; border: none; width: 100%; text-align: left; padding: 15px 10px;
            font-size: 0.95rem; color: var(--text-main); font-weight: 600; border-bottom: 1px solid var(--border-color); 
            display: flex; justify-content: space-between; text-transform: uppercase; transition: color 0.2s;
        }
        .accordion-btn.active { color: var(--primary-color); }
        .accordion-content { max-height: 0; overflow: hidden; background-color: var(--bg-color); transition: max-height 0.3s ease-out; }
        .accordion-content button {
            width: 100%; text-align: left; padding: 12px 10px 12px 20px; background: none; border: none;
            font-size: 0.95rem; color: var(--text-muted); border-bottom: 1px solid var(--border-color);
        }
        .accordion-content button:active { background-color: var(--hover-color); transition: none !important; }

        #panelToggleBtn { 
            position: fixed; top: 50%; right: 0; transform: translateY(-50%); 
            background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);
            border-right: none; padding: 20px 10px; border-radius: 8px 0 0 8px; z-index: 1001; 
            font-size: 0.8rem; font-weight: 600; display: none; writing-mode: vertical-rl; text-transform: uppercase; 
        }
        #panelToggleBtn.open { right: 300px; background-color: var(--primary-color); color: #fff; border-color: transparent; }
    </style>
</head>
<!-- ontouchstart enables instant :active states on iOS -->
<body ontouchstart="">

    <!-- TOP NAVIGATION -->
    <div class="top-nav">
        <div class="nav-buttons-left">
            <button class="action-btn" id="menuBtn" onclick="toggleLeftMenu()">&#9776;</button>
            <button class="action-btn" id="backBtn" onclick="goBackLogic()">&#8592;</button>
        </div>
        <button class="action-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
    </div>

    <!-- LEFT MENU -->
    <div id="leftMenuOverlay" onclick="closeLeftMenu()"></div>
    <div id="leftNavMenu">
        <div class="panel-content" id="leftNavMenuContent">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- RIGHT STUDY PANEL -->
    <div id="panelOverlay" onclick="closeSidePanel()"></div>
    <button id="panelToggleBtn" onclick="toggleSidePanel()">View List</button>
    <div id="flowSidePanel">
        <div class="panel-content">
            <h3 id="sidePanelTitle">Title</h3>
            <div id="sidePanelList"></div>
        </div>
    </div>

    <div class="container-wrapper">
        <!-- HOME / CATEGORIES -->
        <div class="container" id="dynamicContent"></div>

        <!-- STUDY SCREEN -->
        <div class="container" id="studyScreen">
            <h2 class="study-title" id="studyScreenTitle">Title</h2>
            <div class="study-subtitle" id="studyScreenSubtitle">Subtitle</div>
            <div class="flow-box">
                <div id="studyScreenContent"></div>
            </div>
            <button class="next-btn" style="display: block;" onclick="startQuizFromStudy()">Start Drill</button>
        </div>

        <!-- QUIZ SCREEN -->
        <div class="container" id="quizScreen">
            <div class="question-header">
                <span id="qNumber">Q 1/15</span>
                <span id="qScore" style="color: var(--primary-color);">Score: 0</span>
            </div>
            <div class="question-text" id="qText">Loading question...</div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedbackBox"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Continue</button>
        </div>

        <!-- SCORE SCREEN -->
        <div class="container" id="scoreScreen">
            <h2 style="margin: 0; text-transform: uppercase;">Drill Completed</h2>
            <div class="score-val" id="finalScore">0%</div>
            <div id="finalStats" style="color: var(--text-muted); margin-bottom: 20px; font-size: 1rem;"></div>
            <button class="next-btn" style="display: block;" onclick="restartSameQuiz()">Retry Drill</button>
            <button class="next-btn home-btn" style="display: block;" onclick="goBackLogic()">Back to Menu</button>
        </div>
    </div>

    <script>
        const QUESTIONS_PER_DRILL = 15;

        // Structured Database
        const appDatabase = {
            "Checklists": {
                "Normal Procedures": [
                    { id: "EngineStart", title: "Engine Starting", text: "Normal Start", items: ["Passenger Briefing COMPLETE", "Doors and Seatbelts SECURED", "Parking Brake SET", "Fuel Selector BOTH", "Carburetor Heat COLD", "Mixture FULL RICH", "Primer 2-5 STROKES & LOCK", "Master Switch ON", "Lights AS REQUIRED", "Throttle OPEN 1/8 INCH", "Prop Area CLEAR", "Starter ENGAGE", "Throttle 1,000 RPM & ADJUST", "Oil Pressure GREEN", "Mixture LEAN FOR TAXI", "Radio Master ON"] },
                    { id: "PreLineup", title: "Pre-Lineup", text: "Before Takeoff Roll", items: ["Trim/Flaps SET FOR TAKEOFF", "Lights AS REQUIRED", "Aux Fuel Pump ON", "Mixture RICH <3000 D.A.", "Carburetor Heat OFF", "Doors, Windows & Seatbelts SECURED", "Fuel Timer SET", "Traffic CLEAR", "Assigned RWY/HDG CONFIRMED"] },
                    { id: "AfterLanding", title: "After Landing", text: "Runway Cleared", items: ["Flaps UP", "Mixture LEAN FOR TAXI", "Carburetor Heat OFF", "Trim RESET FOR TAKEOFF", "Pitot Heat OFF", "Taxi Light ON", "Landing Light OFF"] },
                    { id: "ShutDown", title: "Shut Down", text: "Engine Shutdown", items: ["Parking Brake SET", "Radio Master OFF", "Exterior Lights OFF", "Cabin / Panel Lights OFF", "Throttle IDLE", "Mixture IDLE CUTOFF", "Ignition Switch OFF & KEY OUT", "Master Switch OFF"] },
                    { id: "Securing", title: "Securing", text: "Airplane Securing", items: ["Lights ALL ON", "Tie Downs & Chocks APPLY", "Control Lock & Pitot Cover INSTALL", "Fuel Selector LEFT or RIGHT", "Cabin Air/Heat OFF", "Windows CLOSE", "Flight Plan CLOSE", "Binder & Fuel Load RECORD", "FSP & Squawks COMPLETE", "Garbage VERIFY CLEAN"] }
                ],
                "Emergency Procedures": [
                    { id: "EngineFireStart", title: "Fire (Start)", text: "Engine Fire During Start", items: ["Cranking CONTINUE", "If Fails: Throttle FULL OPEN", "Mixture IDLE CUTOFF", "Cranking CONTINUE for 3 MINS", "Fire Extinguisher OBTAIN", "Master/Ignition/Fuel OFF"] },
                    { id: "ElecFire", title: "Electrical Fire", text: "Smoke in Cabin", items: ["Master Switch OFF", "Cabin Air & Heat OFF", "Fire Extinguisher CONSIDER USING"] }
                ]
            },
            "Flows": {
                "Ground": [
                    { id: "SixPlusSix", title: "6+6 Flow", text: "Before Taxi Check", items: ["Transponder Code / Clearance", "Barometers", "Altitude Pre-Select(s)", "Comms", "NAVS", "GPS (and MFD ranges)"] },
                    { id: "HalfAndHalf", title: "1/2 & 1/2 Flow", text: "Before Takeoff", items: ["Controls FREE & CORRECT", "Circuit Breakers VERIFY IN", "Trims Reset for Takeoff", "Lights", "GPS #2", "Gauges", "Magnetos", "Carb Heat", "Idle Check"] }
                ],
                "Air": [
                    { id: "Climb", title: "Climb Flow", text: "500' AGL", items: ["Flaps UP", "Taxi Light OFF", "Engine Instruments CHECK"] },
                    { id: "DIMS", title: "DIMS", text: "Cruise Checklist", items: ["D - Directional Gyro ADJUST", "I - Instruments CHECK", "M - Mixture LEAN", "S - Switches AS REQUIRED", "Next Frequencies PREPARE", "Map Range AS APPROPRIATE", "TOD DETERMINE"] },
                    { id: "FourCs", title: "4 C's", text: "Pre-Maneuver", items: ["Clearing Turns PERFORM", "Non Congested Area VERIFY", "Checklist PERFORM", "Declare PERFORM"] },
                    { id: "ABC", title: "ABC", text: "Descent", items: ["A - ATIS/AWOS OBTAIN", "B - Brief PERFORM", "C - Checklist PERFORM"] },
                    { id: "CGUMPS", title: "CGUMPS", text: "Final Check", items: ["C - Clearance & Carb Heat OBTAIN", "G - Gas BOTH", "U - Undercarriage DOWN", "M - Mixture RICH", "P - Pumps/Primer ON/LOCKED", "S - Seatbelts & Switches CHECK"] }
                ],
                "Emergencies": [
                    { id: "ABCD", title: "ABCD", text: "Engine Failure in Flight", items: ["A - Airspeed 68 KIAS", "B - Best Place to Land", "C - Checklist", "D - Declare"] }
                ]
            },
            "Weather": {
                "TAF / METAR": [
                    { id: "WxPrecip", title: "Precipitation", text: "Weather Codes", items: ["RA - Rain", "SN - Snow", "DZ - Drizzle", "GR - Hail", "GS - Small Hail", "PL - Ice Pellets"] },
                    { id: "WxObscure", title: "Obscurations", text: "Visibility Restrictions", items: ["FG - Fog", "BR - Mist", "HZ - Haze", "FU - Smoke", "DU - Dust", "SA - Sand", "VA - Volcanic Ash"] },
                    { id: "WxDesc", title: "Descriptors", text: "Weather Modifiers", items: ["TS - Thunderstorm", "SH - Showers", "FZ - Freezing", "BL - Blowing", "PR - Partial", "BC - Patches", "MI - Shallow"] }
                ]
            },
            "Acronyms": {
                "Emergencies": [
                    { id: "WOSSS", title: "WOSSS", text: "Forced Landing Criteria", items: ["W - Wind", "O - Obstructions", "S - Size", "S - Shape", "S - Surface"] },
                    { id: "ABCDE", title: "ABCDE", text: "Emergency Landing", items: ["A - Airspeed", "B - Best Field", "C - Checklist", "D - Declare", "E - Execute"] }
                ],
                "Equipment & Rules": [
                    { id: "ATOMATO", title: "A TOMATO FLAMES", text: "VFR Day Equipment", items: ["A - Altimeter", "T - Tachometer", "O - Oil Pressure", "M - Manifold Pressure", "A - Airspeed", "T - Temperature Gauge", "O - Oil Temp", "F - Fuel Gauge", "L - Landing Gear Pos", "A - Anti-collision Lights", "M - Magnetic Compass", "E - ELT", "S - Seatbelts"] },
                    { id: "FLAPS", title: "FLAPS", text: "VFR Night Equipment", items: ["F - Fuses", "L - Landing Light", "A - Anti-collision", "P - Position lights", "S - Source of power"] },
                    { id: "ARROW", title: "ARROW", text: "Required Documents", items: ["A - Airworthiness Certificate", "R - Registration", "R - Radio license", "O - Operating limitations", "W - Weight and balance"] }
                ]
            }
        };

        // State
        let currentParent = null;
        let currentActiveFlow = null;
        let generatedQuestions = [];
        let currentQ = 0;
        let score = 0;
        let errors = 0;
        let isAnswered = false;

        // Theme Logic
        function updateThemeButton(isDark) {
            const themeBtn = document.getElementById('themeToggleBtn');
            if(isDark) {
                themeBtn.innerHTML = '☀️';
                themeBtn.style.color = '#fbbf24'; 
                themeBtn.style.borderColor = '#fbbf24';
                themeBtn.style.backgroundColor = 'rgba(251, 191, 36, 0.1)';
            } else {
                themeBtn.innerHTML = '🌙';
                themeBtn.style.color = '#6366f1'; 
                themeBtn.style.borderColor = '#6366f1';
                themeBtn.style.backgroundColor = 'rgba(99, 102, 241, 0.1)';
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            updateThemeButton(isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        // HTML Generator
        function renderFlowList(items) {
            let html = "<ul style='margin:0; padding-left:1.2rem;'>";
            for(let i=0; i<items.length; i++) {
                html += "<li style='margin-bottom:6px;'>" + items[i] + "</li>";
            }
            html += "</ul>";
            return html;
        }

        // ================== HISTORY API (Swipe Back) ==================
        window.addEventListener('popstate', (e) => {
            if (!e.state || e.state.page === 'home') renderHome(false);
            else if (e.state.page === 'category') renderCategory(e.state.cat, false);
            else if (e.state.page === 'study') {
                let foundQuiz = findQuizById(e.state.quizId);
                if (foundQuiz) renderStudyScreen(foundQuiz, false);
                else renderHome(false);
            } else if (e.state.page === 'quiz') {
                let foundQuiz = findQuizById(e.state.quizId);
                if (foundQuiz) startQuiz(foundQuiz, false);
                else renderHome(false);
            }
        });

        function findQuizById(id) {
            for (const cat in appDatabase) {
                for (const subCat in appDatabase[cat]) {
                    for (const quiz of appDatabase[cat][subCat]) {
                        if (quiz.id === id) return quiz;
                    }
                }
            }
            return null;
        }

        function goBackLogic() { history.back(); }

        // ================== UI RENDER FUNCTIONS ==================

        function buildLeftMenu() {
            const menuDiv = document.getElementById('leftNavMenuContent');
            menuDiv.innerHTML = '<h3>Menu</h3><button class="action-btn" style="width:100%; border:none; border-bottom:1px solid var(--border-color); border-radius:0; justify-content:flex-start; padding:15px 10px; margin-bottom:10px; color:var(--text-main);" onclick="navigateTo(\'Home\')">Main Dashboard</button>';

            Object.keys(appDatabase).forEach(catName => {
                const accBtn = document.createElement('button');
                accBtn.className = 'accordion-btn';
                accBtn.innerHTML = `${catName} <span>▼</span>`;
                
                const accContent = document.createElement('div');
                accContent.className = 'accordion-content';
                
                Object.keys(appDatabase[catName]).forEach(subCat => {
                    appDatabase[catName][subCat].forEach(quizObj => {
                        const itemBtn = document.createElement('button');
                        itemBtn.innerText = quizObj.title;
                        itemBtn.onclick = () => { closeLeftMenu(); renderStudyScreen(quizObj, true); };
                        accContent.appendChild(itemBtn);
                    });
                });

                // Accordion logic: only one open at a time
                accBtn.onclick = function() {
                    const isOpen = accContent.style.maxHeight;
                    
                    // Close all first
                    document.querySelectorAll('.accordion-content').forEach(c => c.style.maxHeight = null);
                    document.querySelectorAll('.accordion-btn span').forEach(s => s.innerText = '▼');
                    document.querySelectorAll('.accordion-btn').forEach(b => b.classList.remove('active'));
                    
                    // If it wasn't open, open it
                    if (!isOpen) {
                        accContent.style.maxHeight = accContent.scrollHeight + "px";
                        this.classList.add('active');
                        this.querySelector('span').innerText = '▲';
                    }
                };

                menuDiv.appendChild(accBtn);
                menuDiv.appendChild(accContent);
            });
        }

        function renderHome(pushToHistory = true) {
            currentParent = null;
            hideAllScreens();
            document.getElementById('dynamicContent').style.display = 'block';
            
            const container = document.getElementById('dynamicContent');
            container.innerHTML = '<h1>C-172 Master</h1><div class="subtitle">Select Category</div>';
            
            const grid = document.createElement('div');
            grid.className = 'parent-grid';

            Object.keys(appDatabase).forEach(catName => {
                const btn = document.createElement('button');
                btn.className = 'parent-card';
                btn.innerText = catName;
                btn.onclick = () => renderCategory(catName, true);
                grid.appendChild(btn);
            });

            container.appendChild(grid);
            if (pushToHistory) history.pushState({ page: 'home' }, '');
        }

        function renderCategory(catName, pushToHistory = true) {
            currentParent = catName;
            hideAllScreens();
            document.getElementById('dynamicContent').style.display = 'block';
            document.getElementById('backBtn').style.display = 'flex';
            
            const container = document.getElementById('dynamicContent');
            container.innerHTML = `<h1>${catName}</h1><div class="subtitle">Select Topic</div>`;

            const subCats = appDatabase[catName];
            Object.keys(subCats).forEach(subCatName => {
                const section = document.createElement('div');
                section.className = 'category-section';
                section.innerHTML = `<h3 class="category-title">${subCatName}</h3>`;

                const grid = document.createElement('div');
                grid.className = 'menu-grid';

                subCats[subCatName].forEach(quizObj => {
                    const btn = document.createElement('button');
                    btn.className = 'menu-btn';
                    btn.innerHTML = `${quizObj.title} <small>${quizObj.text}</small>`;
                    btn.onclick = () => renderStudyScreen(quizObj, true);
                    grid.appendChild(btn);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });

            if (pushToHistory) history.pushState({ page: 'category', cat: catName }, '');
        }

        function renderStudyScreen(quizObj, pushToHistory = true) {
            currentActiveFlow = quizObj;
            hideAllScreens();
            document.getElementById('studyScreen').style.display = 'block';
            document.getElementById('backBtn').style.display = 'flex';

            document.getElementById('studyScreenTitle').innerText = quizObj.title;
            document.getElementById('studyScreenSubtitle').innerText = quizObj.text;
            document.getElementById('studyScreenContent').innerHTML = renderFlowList(quizObj.items);

            if (pushToHistory) history.pushState({ page: 'study', quizId: quizObj.id }, '');
        }

        function startQuizFromStudy() { startQuiz(currentActiveFlow, true); }

        function hideAllScreens() {
            document.getElementById('dynamicContent').style.display = 'none';
            document.getElementById('studyScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('scoreScreen').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('panelToggleBtn').style.display = 'none';
            closeSidePanel();
        }

        // Side Menus
        function toggleLeftMenu() {
            document.getElementById('leftNavMenu').classList.add('open');
            document.getElementById('leftMenuOverlay').classList.add('open');
        }
        function closeLeftMenu() {
            document.getElementById('leftNavMenu').classList.remove('open');
            document.getElementById('leftMenuOverlay').classList.remove('open');
        }
        function navigateTo(target) {
            closeLeftMenu();
            if (target === 'Home') renderHome();
            else renderCategory(target);
        }

        function toggleSidePanel() {
            const panel = document.getElementById('flowSidePanel');
            const btn = document.getElementById('panelToggleBtn');
            const overlay = document.getElementById('panelOverlay');
            panel.classList.toggle('open'); btn.classList.toggle('open'); overlay.classList.toggle('open');
            btn.innerText = panel.classList.contains('open') ? 'Hide' : 'List';
        }
        function updateSidePanelContent(q) {
            document.getElementById('sidePanelTitle').innerText = q.flowTitle;
            document.getElementById('sidePanelList').innerHTML = renderFlowList(q.flowItems);
        }
        function closeSidePanel() {
            document.getElementById('flowSidePanel').classList.remove('open');
            const btn = document.getElementById('panelToggleBtn');
            btn.classList.remove('open'); btn.innerText = 'List';
            document.getElementById('panelOverlay').classList.remove('open');
        }

        // ================== QUESTION GENERATORS ==================
        function getRandomOtherItems(currentFlow, count) {
            let allItems = [];
            Object.values(appDatabase).forEach(cat => Object.values(cat).forEach(subCat => subCat.forEach(flow => {
                if (flow.title !== currentFlow.title) allItems = allItems.concat(flow.items);
            })));
            let selected = [];
            for(let i=0; i<count; i++) selected.push(allItems[Math.floor(Math.random() * allItems.length)]);
            return selected;
        }

        function genWhatIsNext() {
            let flow = currentActiveFlow;
            if (flow.items.length < 2) return null;
            let idx = Math.floor(Math.random() * (flow.items.length - 1));
            let currentItem = flow.items[idx];
            let nextItem = flow.items[idx + 1];
            let wrong1 = flow.items[(idx + 2) % flow.items.length];
            let wrong2 = getRandomOtherItems(flow, 1)[0];
            if(wrong1 === nextItem) wrong1 = "Master Switch OFF";

            return {
                question: `In "${flow.title}", what comes immediately after:\n"${currentItem}"?`,
                options: [nextItem, wrong1, wrong2],
                correctAnswer: 0,
                explanation: `The item that immediately follows is: <strong>${nextItem}</strong>`,
                flowTitle: flow.title, flowItems: flow.items
            };
        }

        function genFirstAction() {
            let flow = currentActiveFlow;
            return {
                question: `What is the **first** item in "${flow.title}"?`,
                options: [flow.items[0], flow.items[1] || "Throttle IDLE", flow.items[flow.items.length - 1] || "Mixture CUTOFF"],
                correctAnswer: 0,
                explanation: `It always starts with: <strong>${flow.items[0]}</strong>`,
                flowTitle: flow.title, flowItems: flow.items
            };
        }

        function genNotIncluded() {
            let flow = currentActiveFlow;
            let wrongItem = getRandomOtherItems(flow, 1)[0] || "Declare Emergency";
            return {
                question: `Which of the following is **NOT** part of "${flow.title}"?`,
                options: [wrongItem, flow.items[0], flow.items[flow.items.length - 1] || flow.items[1]],
                correctAnswer: 0,
                explanation: `The item <strong>${wrongItem}</strong> does not belong to this sequence.`,
                flowTitle: flow.title, flowItems: flow.items
            };
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startQuiz(quizObj, pushToHistory = true) {
            currentActiveFlow = quizObj;
            generatedQuestions = [];
            
            for (let i = 0; i < QUESTIONS_PER_DRILL; i++) {
                let q = null, attempts = 0;
                while (!q && attempts < 15) {
                    let rand = Math.random();
                    if (rand < 0.33) q = genWhatIsNext();
                    else if (rand < 0.66) q = genFirstAction();
                    else q = genNotIncluded();
                    attempts++;
                }
                if (q) {
                    let optsWithIdx = q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.correctAnswer }));
                    optsWithIdx = shuffleArray(optsWithIdx);
                    generatedQuestions.push({
                        question: q.question,
                        options: optsWithIdx.map(o => o.text),
                        correctAnswer: optsWithIdx.findIndex(o => o.isCorrect),
                        explanation: q.explanation, flowTitle: q.flowTitle, flowItems: q.flowItems
                    });
                } else i--;
            }

            hideAllScreens();
            document.getElementById('quizScreen').style.display = 'block';
            document.getElementById('backBtn').style.display = 'flex';
            document.getElementById('panelToggleBtn').style.display = 'block';

            currentQ = 0; score = 0; errors = 0;
            loadQuestion();
            if (pushToHistory) history.pushState({ page: 'quiz', quizId: quizObj.id }, '');
        }

        function loadQuestion() {
            isAnswered = false;
            let fb = document.getElementById('feedbackBox');
            fb.className = 'feedback';
            fb.innerHTML = '';
            document.getElementById('nextBtn').style.display = 'none';
            
            let q = generatedQuestions[currentQ];
            document.getElementById('qNumber').innerText = `Q ${currentQ + 1} / ${QUESTIONS_PER_DRILL}`;
            document.getElementById('qScore').innerText = `Score: ${score}`;
            document.getElementById('qText').innerText = q.question;
            
            updateSidePanelContent(q);

            const optsContainer = document.getElementById('optionsContainer');
            optsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            let q = generatedQuestions[currentQ];
            let allBtns = document.getElementById('optionsContainer').querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);

            let isCorrect = (selectedIndex === q.correctAnswer);
            let fb = document.getElementById('feedbackBox');

            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;
                fb.classList.add('show', 'success');
            } else {
                btnElement.classList.add('wrong');
                errors++;
                allBtns[q.correctAnswer].classList.add('correct');
                fb.classList.add('show', 'error');
            }

            fb.innerHTML = `<strong>${isCorrect ? 'Correct' : 'Incorrect'}</strong><br><span>${q.explanation}</span><div class="flow-box"><h4>Study Material (${q.flowTitle}):</h4>${renderFlowList(q.flowItems)}</div>`;
            document.getElementById('qScore').innerText = `Score: ${score}`;
            
            let nextBtn = document.getElementById('nextBtn');
            nextBtn.innerText = (currentQ === QUESTIONS_PER_DRILL - 1) ? "Finish Drill" : "Continue";
            nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < QUESTIONS_PER_DRILL) loadQuestion();
            else showScore();
        }

        function showScore() {
            hideAllScreens();
            document.getElementById('scoreScreen').style.display = 'block';
            document.getElementById('backBtn').style.display = 'flex';
            
            let percentage = Math.round((score / QUESTIONS_PER_DRILL) * 100);
            document.getElementById('finalScore').innerText = percentage + "%";
            document.getElementById('finalStats').innerHTML = `Correct: ${score} out of ${QUESTIONS_PER_DRILL}<br>Errors: ${errors}`;
        }

        function restartSameQuiz() { startQuiz(currentActiveFlow, false); }

        document.addEventListener("DOMContentLoaded", () => {
            updateThemeButton(document.body.classList.contains('dark-mode'));
            buildLeftMenu();
            history.replaceState({ page: 'home' }, '');
            renderHome(false);
        });
    </script>
</body>
</html>
