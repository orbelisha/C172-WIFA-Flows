<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="C172 Master">
    <title>C-172 Knowledge Master</title>
    <style>
        /* =========================================================
           iOS NATIVE DESIGN SYSTEM
           ========================================================= */
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #000000;
            --text-muted: #8A8A8E;
            --primary-color: #007AFF; 
            --hover-color: #E5E5EA;
            --correct-color: #34C759;
            --wrong-color: #FF3B30;
            --border-color: #C6C6C8;
        }

        body.dark-mode {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-main: #FFFFFF;
            --text-muted: #98989D;
            --primary-color: #0A84FF;
            --hover-color: #2C2C2E;
            --correct-color: #32D74B;
            --wrong-color: #FF453A;
            --border-color: #38383A;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
            font-size: 15px; /* Optimized for mobile */
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* =========================================================
           TOP NAVIGATION
           ========================================================= */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            height: calc(env(safe-area-inset-top, 20px) + 50px);
            background-color: rgba(242, 242, 247, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--border-color);
            display: flex; align-items: flex-end; justify-content: space-between;
            padding: 8px 16px; z-index: 100;
        }
        body.dark-mode .top-nav { background-color: rgba(0, 0, 0, 0.85); }

        .icon-btn {
            background: none; border: none; color: var(--primary-color);
            padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:active { opacity: 0.5; }
        .nav-group { display: flex; gap: 12px; }
        #backBtn, #studyBtn { display: none; }

        /* =========================================================
           LAYOUT & TRANSITIONS
           ========================================================= */
        .main-wrapper {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            width: 100%; padding: 16px;
            padding-top: calc(env(safe-area-inset-top, 20px) + 70px);
            padding-bottom: 40px;
        }

        .page { display: none; width: 100%; max-width: 600px; }
        .page.active { 
            display: block; 
            animation: iOSFadeIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
        }

        @keyframes iOSFadeIn {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Typography */
        h1 { margin: 0 0 4px 0; font-size: 1.4rem; font-weight: 700; text-align: center; }
        .subtitle { color: var(--text-muted); margin-bottom: 24px; font-size: 0.85rem; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

        /* =========================================================
           iOS GROUPED LISTS (CARDS)
           ========================================================= */
        .list-group { margin-bottom: 24px; }
        .list-group-header { font-size: 0.8rem; color: var(--text-muted); margin-left: 16px; margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
        .list-group-body { background: var(--card-bg); border-radius: 12px; overflow: hidden; }
        
        .list-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; border-bottom: 0.5px solid var(--border-color); cursor: pointer;
        }
        .list-row:last-child { border-bottom: none; }
        .list-row:active { background-color: var(--hover-color); }
        
        .list-title { font-size: 1rem; font-weight: 500; color: var(--text-main); margin-bottom: 2px; }
        .list-subtitle { font-size: 0.8rem; color: var(--text-muted); }
        .chevron { color: var(--border-color); }

        /* Static rows for Study material */
        .list-row-static { padding: 12px 16px; border-bottom: 0.5px solid var(--border-color); font-size: 0.95rem; line-height: 1.4; color: var(--text-main); }
        .list-row-static:last-child { border-bottom: none; }

        /* =========================================================
           QUIZ UI
           ========================================================= */
        .progress-container { width: 100%; height: 6px; background: var(--hover-color); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary-color); width: 0%; transition: width 0.3s ease; }

        .question-header { display: flex; justify-content: space-between; margin-bottom: 16px; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 24px; line-height: 1.35; color: var(--text-main); }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { 
            background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); 
            border-radius: 12px; padding: 14px 16px; font-size: 0.95rem; text-align: left; font-weight: 500; line-height: 1.4; 
        }
        .option-btn:active:not(:disabled) { background: var(--hover-color); transform: scale(0.98); }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background: var(--correct-color) !important; color: #fff; border-color: var(--correct-color); font-weight: 600; }
        .option-btn.wrong { background: var(--wrong-color) !important; color: #fff; border-color: var(--wrong-color); font-weight: 600; }

        .feedback { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 0.9rem; display: none; line-height: 1.4; font-weight: 500; }
        .feedback.show { display: block; animation: iOSFadeIn 0.3s ease forwards; }
        .feedback.success { background: var(--correct-bg); color: var(--correct-color); }
        .feedback.error { background: var(--wrong-bg); color: var(--wrong-color); }

        .primary-btn { 
            background: var(--primary-color); color: #fff; border: none; padding: 16px; font-size: 1rem; 
            border-radius: 12px; font-weight: 600; margin-top: 24px; width: 100%; display: none; text-transform: uppercase;
        }
        .primary-btn:active { opacity: 0.8; }
        .start-btn { display: block; margin-top: 24px; }

        /* Score Screen */
        .score-val { font-size: 4rem; font-weight: 800; color: var(--primary-color); margin: 10px 0; letter-spacing: -2px; text-align: center; }
        .secondary-btn { background: var(--card-bg); color: var(--primary-color); border: 1px solid var(--primary-color); margin-top: 12px; }
        .secondary-btn:active { background: var(--hover-color); }

        /* =========================================================
           SIDE MENUS
           ========================================================= */
        #leftMenuOverlay, #rightMenuOverlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 998; opacity: 0; transition: opacity 0.3s ease;
        }
        #leftMenuOverlay.open, #rightMenuOverlay.open { display: block; opacity: 1; }

        .side-menu {
            position: fixed; top: 0; height: 100vh; background: var(--bg-color);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 1000; overflow-y: auto; 
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        #leftNavMenu { left: 0; width: 280px; border-right: 0.5px solid var(--border-color); transform: translateX(-100%); }
        #leftNavMenu.open { transform: translateX(0); }
        
        #rightNavMenu { right: 0; width: 300px; border-left: 0.5px solid var(--border-color); transform: translateX(100%); }
        #rightNavMenu.open { transform: translateX(0); }

        .menu-header { padding: calc(env(safe-area-inset-top, 20px) + 20px) 16px 12px 16px; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }

        .sidebar-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); border-bottom: 0.5px solid var(--border-color);
        }
        .sidebar-item:first-of-type { border-top: 0.5px solid var(--border-color); }
        
        .sidebar-text { flex: 1; padding: 14px 16px; font-size: 1rem; font-weight: 500; color: var(--text-main); cursor: pointer; }
        .sidebar-text:active { background: var(--hover-color); }
        
        .sidebar-icon { padding: 14px 16px; cursor: pointer; color: var(--text-muted); transition: transform 0.2s; border-left: 0.5px solid var(--border-color); }
        .sidebar-icon:active { background: var(--hover-color); }
        
        .sidebar-sub { max-height: 0; overflow: hidden; background: var(--bg-color); transition: max-height 0.3s ease; }
        .sidebar-sub button {
            width: 100%; text-align: left; padding: 12px 16px 12px 32px; background: none; border: none;
            font-size: 0.9rem; color: var(--text-muted); border-bottom: 0.5px solid var(--border-color);
        }
        .sidebar-sub button:active { background: var(--hover-color); }

        /* =========================================================
           FOOTER
           ========================================================= */
        .footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.75rem; width: 100%; margin-top: auto; }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION (SVG ICONS) -->
    <div class="top-nav">
        <div class="nav-group">
            <!-- Hamburger Menu -->
            <button class="icon-btn" onclick="toggleLeftMenu()">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <!-- Back Arrow -->
            <button class="icon-btn" id="backBtn" onclick="goBackLogic()">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
        </div>
        <div class="nav-group">
            <!-- Study Material (Book) -->
            <button class="icon-btn" id="studyBtn" onclick="toggleRightMenu()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            </button>
            <!-- Theme Toggle (Sun/Moon injected by JS) -->
            <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()"></button>
        </div>
    </div>

    <!-- LEFT MENU -->
    <div id="leftMenuOverlay" onclick="closeLeftMenu()"></div>
    <div id="leftNavMenu" class="side-menu">
        <div id="leftNavMenuContent"></div>
    </div>

    <!-- RIGHT STUDY PANEL -->
    <div id="rightMenuOverlay" onclick="closeRightMenu()"></div>
    <div id="rightNavMenu" class="side-menu">
        <div class="menu-header">Study Material</div>
        <div class="list-group">
            <div class="list-group-body" id="rightPanelContent"></div>
        </div>
    </div>

    <div class="main-wrapper">
        <!-- HOME SCREEN -->
        <div class="page active" id="homeScreen">
            <h1>C-172 Master</h1>
            <div class="subtitle">Select Category</div>
            <div id="homeCategories"></div>
        </div>

        <!-- CATEGORY SCREEN -->
        <div class="page" id="categoryScreen">
            <h1 id="catTitle">Title</h1>
            <div class="subtitle">Select Topic</div>
            <div id="catContent"></div>
        </div>

        <!-- STUDY SCREEN -->
        <div class="page" id="studyScreen">
            <h1 id="studyTitle">Title</h1>
            <div class="subtitle" id="studySubtitle">Subtitle</div>
            <div class="list-group">
                <div class="list-group-body" id="studyListContent"></div>
            </div>
            <button class="primary-btn start-btn" onclick="startQuizFromStudy()">Start Drill</button>
        </div>

        <!-- QUIZ SCREEN -->
        <div class="page" id="quizScreen">
            <div class="progress-container"><div class="progress-bar" id="quizProgress"></div></div>
            <div class="question-header">
                <span id="qNumber">Q 1/15</span>
                <span id="qScore" style="color: var(--primary-color);">Score: 0</span>
            </div>
            <div class="question-text" id="qText">Question</div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedbackBox"></div>
            <button class="primary-btn" id="nextBtn" onclick="nextQuestion()">Continue</button>
        </div>

        <!-- SCORE SCREEN -->
        <div class="page" id="scoreScreen">
            <h1 style="text-transform: uppercase;">Drill Completed</h1>
            <div class="score-val" id="finalScore">0%</div>
            <div class="subtitle" id="finalStats" style="margin-bottom: 30px;"></div>
            <button class="primary-btn start-btn" onclick="restartSameQuiz()">Retry Drill</button>
            <button class="primary-btn secondary-btn start-btn" onclick="goBackLogic()">Back to Menu</button>
        </div>
        
        <!-- FOOTER -->
        <div class="footer">v1.3.0 | &copy; 2026 Or Belisha</div>
    </div>

    <script>
        const QUESTIONS_PER_DRILL = 15;

        // FIXED DATABASE - Precise Flows vs Checklists
        const appDatabase = {
            "Checklists": {
                "Normal Procedures": [
                    { id: "EngineStart", title: "Engine Starting", text: "Normal Start", items: ["Passenger Briefing COMPLETE", "Doors and Seatbelts SECURED", "Parking Brake SET", "Fuel Selector BOTH", "Carburetor Heat COLD", "Mixture FULL RICH", "Primer 2-5 STROKES & LOCK", "Master Switch ON", "Lights AS REQUIRED", "Throttle OPEN 1/8 INCH", "Prop Area CLEAR", "Starter ENGAGE", "Throttle 1,000 RPM & ADJUST", "Oil Pressure GREEN", "Mixture LEAN FOR TAXI", "Radio Master ON"] },
                    { id: "PreLineup", title: "Pre-Lineup", text: "Before Takeoff Roll", items: ["Trim/Flaps SET FOR TAKEOFF", "Lights AS REQUIRED", "Aux Fuel Pump ON", "Mixture RICH <3000 D.A.", "Carburetor Heat OFF", "Doors, Windows & Seatbelts SECURED", "Fuel Timer SET", "Traffic CLEAR", "Assigned RWY/HDG CONFIRMED"] },
                    { id: "ClimbCheck", title: "Climb", text: "500' AGL", items: ["Flaps UP", "Taxi Light OFF", "Engine Instruments CHECK"] },
                    { id: "CruiseCheck", title: "Cruise", text: "Cruise Checklist", items: ["Aux Fuel Pump OFF", "Pitch Attitude OBTAIN", "Power CRUISE RPM", "DIMS Flow PERFORM", "Next Frequencies PREPARE", "Map Range AS APPROPRIATE", "TOD DETERMINE"] },
                    { id: "AfterLanding", title: "After Landing", text: "Runway Cleared", items: ["Flaps UP", "Mixture LEAN FOR TAXI", "Carburetor Heat OFF", "Trim RESET FOR TAKEOFF", "Pitot Heat OFF", "Taxi Light ON", "Landing Light OFF"] },
                    { id: "ShutDown", title: "Shut Down", text: "Engine Shutdown", items: ["Parking Brake SET", "Radio Master OFF", "Exterior Lights OFF", "Cabin / Panel Lights OFF", "Throttle IDLE", "Mixture IDLE CUTOFF", "Ignition Switch OFF & KEY OUT", "Master Switch OFF"] },
                    { id: "Securing", title: "Securing", text: "Airplane Securing", items: ["Lights ALL ON", "Tie Downs & Chocks APPLY", "Control Lock & Pitot Cover INSTALL", "Fuel Selector LEFT or RIGHT", "Cabin Air/Heat OFF", "Windows CLOSE", "Flight Plan CLOSE", "Binder & Fuel Load RECORD", "FSP & Squawks COMPLETE", "Garbage VERIFY CLEAN"] }
                ],
                "Emergency Procedures": [
                    { id: "EngineFireStart", title: "Fire (Start)", text: "Engine Fire During Start", items: ["Cranking CONTINUE", "If Fails: Throttle FULL OPEN", "Mixture IDLE CUTOFF", "Cranking CONTINUE for 3 MINS", "Fire Extinguisher OBTAIN", "Master/Ignition/Fuel OFF"] },
                    { id: "ElecFire", title: "Electrical Fire", text: "Smoke in Cabin", items: ["Master Switch OFF", "Cabin Air & Heat OFF", "Fire Extinguisher CONSIDER USING"] }
                ]
            },
            "Flows": {
                "Ground": [
                    { id: "SixPlusSix", title: "6+6 Flow", text: "Before Taxi", items: ["Transponder Code / Clearance", "Barometers", "Altitude Pre-Select(s)", "Comms", "NAVS", "GPS (and MFD ranges)"] },
                    { id: "HalfAndHalf", title: "1/2 & 1/2 Flow", text: "Before Takeoff", items: ["Controls FREE & CORRECT", "Circuit Breakers VERIFY IN", "Trims Reset for Takeoff", "Lights", "GPS #2", "Gauges", "Magnetos", "Carb Heat", "Idle Check"] }
                ],
                "Air": [
                    { id: "DIMS", title: "DIMS", text: "Cruise Flow", items: ["D - Directional Gyro ADJUST", "I - Instruments CHECK", "M - Mixture LEAN", "S - Switches AS REQUIRED"] },
                    { id: "FourCs", title: "4 C's", text: "Pre-Maneuver", items: ["Clearing Turns PERFORM", "Non Congested Area VERIFY", "Checklist PERFORM", "Declare PERFORM"] },
                    { id: "ABC", title: "ABC", text: "Descent", items: ["A - ATIS/AWOS OBTAIN", "B - Brief PERFORM", "C - Checklist PERFORM"] },
                    { id: "CGUMPS", title: "CGUMPS", text: "Final Check", items: ["C - Clearance & Carb Heat OBTAIN", "G - Gas BOTH", "U - Undercarriage DOWN", "M - Mixture RICH", "P - Pumps/Primer ON", "S - Seatbelts & Switches CHECK"] }
                ],
                "Emergencies": [
                    { id: "ABCD", title: "ABCD", text: "Engine Failure", items: ["A - Airspeed 68 KIAS", "B - Best Place to Land", "C - Checklist", "D - Declare"] }
                ]
            },
            "Weather": {
                "TAF / METAR": [
                    { id: "WxPrecip", title: "Precipitation", text: "Codes", items: ["RA - Rain", "SN - Snow", "DZ - Drizzle", "GR - Hail", "GS - Small Hail", "PL - Ice Pellets"] },
                    { id: "WxObscure", title: "Obscurations", text: "Restrictions", items: ["FG - Fog", "BR - Mist", "HZ - Haze", "FU - Smoke", "DU - Dust", "SA - Sand", "VA - Volcanic Ash"] },
                    { id: "WxDesc", title: "Descriptors", text: "Modifiers", items: ["TS - Thunderstorm", "SH - Showers", "FZ - Freezing", "BL - Blowing", "PR - Partial", "BC - Patches", "MI - Shallow"] }
                ]
            },
            "Acronyms": {
                "Emergencies": [
                    { id: "WOSSS", title: "WOSSS", text: "Forced Landing", items: ["W - Wind", "O - Obstructions", "S - Size", "S - Shape", "S - Surface"] },
                    { id: "ABCDE", title: "ABCDE", text: "Emergency Landing", items: ["A - Airspeed", "B - Best Field", "C - Checklist", "D - Declare", "E - Execute"] }
                ],
                "Equipment & Rules": [
                    { id: "ATOMATO", title: "A TOMATO FLAMES", text: "VFR Day", items: ["A - Altimeter", "T - Tachometer", "O - Oil Pressure", "M - Manifold Pressure", "A - Airspeed", "T - Temperature Gauge", "O - Oil Temp", "F - Fuel Gauge", "L - Landing Gear Pos", "A - Anti-collision Lights", "M - Magnetic Compass", "E - ELT", "S - Seatbelts"] },
                    { id: "FLAPS", title: "FLAPS", text: "VFR Night", items: ["F - Fuses", "L - Landing Light", "A - Anti-collision", "P - Position lights", "S - Source of power"] },
                    { id: "ARROW", title: "ARROW", text: "Required Docs", items: ["A - Airworthiness Certificate", "R - Registration", "R - Radio license", "O - Operating limitations", "W - Weight and balance"] }
                ]
            }
        };

        // State
        let currentParent = null;
        let currentActiveFlow = null;
        let generatedQuestions = [];
        let currentQ = 0;
        let score = 0;
        let errors = 0;
        let isAnswered = false;

        // SVGs
        const sunIcon = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF9500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        const moonIcon = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
        const chevronSvg = `<svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
        const arrowDownSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;

        // Theme
        function updateThemeButton(isDark) { document.getElementById('themeToggleBtn').innerHTML = isDark ? sunIcon : moonIcon; }
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            updateThemeButton(isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

        // History API
        window.addEventListener('popstate', (e) => {
            if (!e.state || e.state.page === 'home') showPage('homeScreen', false);
            else if (e.state.page === 'category') { renderCategory(e.state.cat, false); showPage('categoryScreen', false); }
            else if (e.state.page === 'study') {
                let f = findQuizById(e.state.quizId);
                if (f) { renderStudyScreen(f, false); showPage('studyScreen', false); }
                else showPage('homeScreen', false);
            } else if (e.state.page === 'quiz') {
                let f = findQuizById(e.state.quizId);
                if (f) { startQuiz(f, false); showPage('quizScreen', false); }
                else showPage('homeScreen', false);
            }
        });

        function findQuizById(id) {
            for (const cat in appDatabase)
                for (const subCat in appDatabase[cat])
                    for (const quiz of appDatabase[cat][subCat])
                        if (quiz.id === id) return quiz;
            return null;
        }

        function goBackLogic() { history.back(); }

        // Page Router
        function showPage(pageId, pushToHistory = true, historyState = {page: 'home'}) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            // Manage Top Nav Buttons
            document.getElementById('backBtn').style.display = (pageId === 'homeScreen') ? 'none' : 'flex';
            document.getElementById('studyBtn').style.display = (pageId === 'quizScreen') ? 'flex' : 'none';
            
            closeLeftMenu(); closeRightMenu(); resetLeftMenuAccordions();
            if (pushToHistory) history.pushState(historyState, '');
        }

        // HTML Builders
        function buildListRows(items) {
            return items.map(item => `<div class="list-row-static">${item}</div>`).join('');
        }

        function buildLeftMenu() {
            const menu = document.getElementById('leftNavMenuContent');
            menu.innerHTML = `<div class="menu-header">Main Menu</div><div class="list-group"><div class="list-group-body"><div class="sidebar-item"><div class="sidebar-text" onclick="showPage('homeScreen', true)">Dashboard</div></div></div></div><div class="menu-header">Categories</div><div class="list-group" id="sidebarCats"></div>`;
            
            const catContainer = document.getElementById('sidebarCats');
            
            Object.keys(appDatabase).forEach(catName => {
                const itemDiv = document.createElement('div');
                itemDiv.innerHTML = `
                    <div class="list-group-body" style="margin-bottom:12px;">
                        <div class="sidebar-item">
                            <div class="sidebar-text" onclick="renderCategory('${catName}')">${catName}</div>
                            <div class="sidebar-icon">${arrowDownSvg}</div>
                        </div>
                        <div class="sidebar-sub"></div>
                    </div>`;
                
                const iconBtn = itemDiv.querySelector('.sidebar-icon');
                const subContent = itemDiv.querySelector('.sidebar-sub');
                
                Object.keys(appDatabase[catName]).forEach(subCat => {
                    appDatabase[catName][subCat].forEach(quizObj => {
                        const btn = document.createElement('button');
                        btn.innerText = quizObj.title;
                        btn.onclick = () => renderStudyScreen(quizObj);
                        subContent.appendChild(btn);
                    });
                });

                iconBtn.onclick = () => {
                    const isOpen = subContent.style.maxHeight;
                    resetLeftMenuAccordions();
                    if (!isOpen) {
                        subContent.style.maxHeight = subContent.scrollHeight + "px";
                        iconBtn.style.transform = "rotate(180deg)";
                    }
                };
                
                catContainer.appendChild(itemDiv);
            });
        }

        function resetLeftMenuAccordions() {
            document.querySelectorAll('.sidebar-sub').forEach(c => c.style.maxHeight = null);
            document.querySelectorAll('.sidebar-icon').forEach(s => s.style.transform = "rotate(0deg)");
        }

        function renderHome() {
            const container = document.getElementById('homeCategories');
            container.innerHTML = '';
            
            Object.keys(appDatabase).forEach(catName => {
                const group = document.createElement('div');
                group.className = 'list-group';
                group.innerHTML = `<div class="list-group-body"><div class="list-row" onclick="renderCategory('${catName}')"><div class="list-title">${catName}</div>${chevronSvg}</div></div>`;
                container.appendChild(group);
            });
        }

        function renderCategory(catName, pushToHistory = true) {
            currentParent = catName;
            document.getElementById('catTitle').innerText = catName;
            const container = document.getElementById('catContent');
            container.innerHTML = '';

            Object.keys(appDatabase[catName]).forEach(subCatName => {
                const group = document.createElement('div');
                group.className = 'list-group';
                group.innerHTML = `<div class="list-group-header">${subCatName}</div><div class="list-group-body"></div>`;
                const body = group.querySelector('.list-group-body');

                appDatabase[catName][subCatName].forEach(quizObj => {
                    const row = document.createElement('div');
                    row.className = 'list-row';
                    row.innerHTML = `<div><div class="list-title">${quizObj.title}</div><div class="list-subtitle">${quizObj.text}</div></div>${chevronSvg}`;
                    row.onclick = () => renderStudyScreen(quizObj);
                    body.appendChild(row);
                });
                container.appendChild(group);
            });
            showPage('categoryScreen', pushToHistory, {page: 'category', cat: catName});
        }

        function renderStudyScreen(quizObj, pushToHistory = true) {
            currentActiveFlow = quizObj;
            document.getElementById('studyTitle').innerText = quizObj.title;
            document.getElementById('studySubtitle').innerText = quizObj.text;
            document.getElementById('studyListContent').innerHTML = buildListRows(quizObj.items);
            
            // Populate right sidebar
            document.getElementById('rightPanelContent').innerHTML = buildListRows(quizObj.items);

            showPage('studyScreen', pushToHistory, {page: 'study', quizId: quizObj.id});
        }

        // Side Menus
        function toggleLeftMenu() { document.getElementById('leftNavMenu').classList.add('open'); document.getElementById('leftMenuOverlay').classList.add('open'); }
        function closeLeftMenu() { document.getElementById('leftNavMenu').classList.remove('open'); document.getElementById('leftMenuOverlay').classList.remove('open'); }
        function toggleRightMenu() { document.getElementById('rightNavMenu').classList.add('open'); document.getElementById('rightMenuOverlay').classList.add('open'); }
        function closeRightMenu() { document.getElementById('rightNavMenu').classList.remove('open'); document.getElementById('rightMenuOverlay').classList.remove('open'); }

        // ================== QUIZ ENGINE ==================
        function getRandomOtherItems(currentFlow, count) {
            let allItems = [];
            Object.values(appDatabase).forEach(c => Object.values(c).forEach(sc => sc.forEach(f => {
                if (f.title !== currentFlow.title) allItems = allItems.concat(f.items);
            })));
            let selected = [];
            for(let i=0; i<count; i++) selected.push(allItems[Math.floor(Math.random() * allItems.length)]);
            return selected;
        }

        function genWhatIsNext() {
            let flow = currentActiveFlow;
            if (flow.items.length < 2) return null;
            let idx = Math.floor(Math.random() * (flow.items.length - 1));
            let currentItem = flow.items[idx];
            let nextItem = flow.items[idx + 1];
            let wrong1 = flow.items[(idx + 2) % flow.items.length];
            let wrong2 = getRandomOtherItems(flow, 1)[0];
            if(wrong1 === nextItem) wrong1 = "Master Switch OFF";

            return {
                question: `In "${flow.title}", what follows:\n"${currentItem}"?`,
                options: [nextItem, wrong1, wrong2],
                correctAnswer: 0,
                explanation: `Correct sequence: <strong>${nextItem}</strong>`
            };
        }

        function genFirstAction() {
            let flow = currentActiveFlow;
            return {
                question: `What is the **first** item in "${flow.title}"?`,
                options: [flow.items[0], flow.items[1] || "Throttle IDLE", flow.items[flow.items.length - 1] || "Mixture CUTOFF"],
                correctAnswer: 0,
                explanation: `It starts with: <strong>${flow.items[0]}</strong>`
            };
        }

        function genNotIncluded() {
            let flow = currentActiveFlow;
            let wrongItem = getRandomOtherItems(flow, 1)[0] || "Declare Emergency";
            return {
                question: `Which is **NOT** part of "${flow.title}"?`,
                options: [wrongItem, flow.items[0], flow.items[flow.items.length - 1] || flow.items[1]],
                correctAnswer: 0,
                explanation: `<strong>${wrongItem}</strong> is not in this procedure.`
            };
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startQuizFromStudy() { startQuiz(currentActiveFlow, true); }

        function startQuiz(quizObj, pushToHistory = true) {
            currentActiveFlow = quizObj;
            generatedQuestions = [];
            
            for (let i = 0; i < QUESTIONS_PER_DRILL; i++) {
                let q = null, attempts = 0;
                while (!q && attempts < 15) {
                    let rand = Math.random();
                    if (rand < 0.33) q = genWhatIsNext();
                    else if (rand < 0.66) q = genFirstAction();
                    else q = genNotIncluded();
                    attempts++;
                }
                if (q) {
                    let optsWithIdx = q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.correctAnswer }));
                    optsWithIdx = shuffleArray(optsWithIdx);
                    generatedQuestions.push({
                        question: q.question,
                        options: optsWithIdx.map(o => o.text),
                        correctAnswer: optsWithIdx.findIndex(o => o.isCorrect),
                        explanation: q.explanation
                    });
                } else i--;
            }

            currentQ = 0; score = 0; errors = 0;
            loadQuestion();
            showPage('quizScreen', pushToHistory, {page: 'quiz', quizId: quizObj.id});
        }

        function loadQuestion() {
            isAnswered = false;
            let fb = document.getElementById('feedbackBox');
            fb.className = 'feedback'; fb.innerHTML = '';
            document.getElementById('nextBtn').style.display = 'none';
            
            document.getElementById('qNumber').innerText = `Q ${currentQ + 1} / ${QUESTIONS_PER_DRILL}`;
            document.getElementById('qScore').innerText = `Score: ${score}`;
            document.getElementById('quizProgress').style.width = `${(currentQ / QUESTIONS_PER_DRILL) * 100}%`;
            
            let q = generatedQuestions[currentQ];
            document.getElementById('qText').innerText = q.question;
            
            const optsContainer = document.getElementById('optionsContainer');
            optsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            let q = generatedQuestions[currentQ];
            let allBtns = document.getElementById('optionsContainer').querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);

            let isCorrect = (selectedIndex === q.correctAnswer);
            let fb = document.getElementById('feedbackBox');

            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;
                fb.classList.add('show', 'success');
            } else {
                btnElement.classList.add('wrong');
                errors++;
                allBtns[q.correctAnswer].classList.add('correct');
                fb.classList.add('show', 'error');
            }

            fb.innerHTML = `<strong>${isCorrect ? 'Correct' : 'Incorrect'}</strong><br><span>${q.explanation}</span>`;
            document.getElementById('qScore').innerText = `Score: ${score}`;
            document.getElementById('quizProgress').style.width = `${((currentQ + 1) / QUESTIONS_PER_DRILL) * 100}%`;
            
            let nextBtn = document.getElementById('nextBtn');
            nextBtn.innerText = (currentQ === QUESTIONS_PER_DRILL - 1) ? "Finish Drill" : "Continue";
            nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < QUESTIONS_PER_DRILL) loadQuestion();
            else showScore();
        }

        function showScore() {
            let percentage = Math.round((score / QUESTIONS_PER_DRILL) * 100);
            document.getElementById('finalScore').innerText = percentage + "%";
            document.getElementById('finalStats').innerHTML = `Correct: ${score} out of ${QUESTIONS_PER_DRILL}<br>Errors: ${errors}`;
            showPage('scoreScreen', true, {page: 'home'});
        }

        function restartSameQuiz() { startQuiz(currentActiveFlow, false); }

        // Initialize App
        document.addEventListener("DOMContentLoaded", () => {
            updateThemeButton(document.body.classList.contains('dark-mode'));
            buildLeftMenu();
            renderHome();
        });
    </script>
</body>
</html>
